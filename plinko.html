<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Plinko — KATYSHKA</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/plinko.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body class="page-plinko">
  <header class="app-header">
    <div class="left-controls"></div>
    <div class="header-title" style="color:var(--accent)">🎯 PLINKO</div>
    <div class="right-controls" style="position:relative">
      <div class="balance-pill" id="balTrigger" style="cursor:pointer">
        <span class="wallet-icon">👛</span>
        <span class="balance-value" id="hbal">0.00</span>
        <span class="currency">$</span>
        <span class="caret">▾</span>
      </div>
      <div style="width:32px;height:32px"></div>
    </div>
  </header>

  <main class="content">
    <section class="plinko-game">
      <div class="plinko-board">

        <!-- History -->
        <div class="ph-wrap">
          <div class="ph-title">История</div>
          <div class="ph-list" id="phList"></div>
        </div>

        <!-- Canvas Board -->
        <div class="plinko-canvas-wrap">
          <canvas id="plinkoCanvas"></canvas>
          <div id="plinkoBalls"></div>
        </div>

        <!-- Slots -->
        <div class="plinko-slots" id="plinkoSlots"></div>

        <!-- Controls -->
        <div class="plinko-controls">
          <div class="plk-row">
            <div class="plk-label">Риск</div>
            <div class="plk-btns" id="riskBtns">
              <button class="plk-btn active" data-risk="low">Низкий</button>
              <button class="plk-btn" data-risk="medium">Средний</button>
              <button class="plk-btn" data-risk="high">Высокий</button>
            </div>
          </div>
          <div class="plk-row">
            <div class="plk-label">Ряды</div>
            <div class="plk-btns" id="rowsBtns">
              <button class="plk-btn" data-rows="8">8</button>
              <button class="plk-btn" data-rows="10">10</button>
              <button class="plk-btn" data-rows="12">12</button>
              <button class="plk-btn" data-rows="14">14</button>
              <button class="plk-btn active" data-rows="16">16</button>
            </div>
          </div>
          <div class="plk-row">
            <div class="plk-label">Шариков</div>
            <div class="plk-btns" id="ballBtns">
              <button class="plk-btn active" data-count="1">1</button>
              <button class="plk-btn" data-count="3">3</button>
              <button class="plk-btn" data-count="5">5</button>
              <button class="plk-btn" data-count="10">10</button>
            </div>
          </div>
        </div>

        <!-- Stake -->
        <div class="stake-panel">
          <div class="stake-header">
            <label>Ставка</label>
            <span class="stake-range">От $0.1 до $100</span>
          </div>
          <div class="stake-row">
            <input id="stakeInput" type="number" min="0.1" max="100" step="0.1" value="1">
            <div class="stake-buttons">
              <button id="halfBtn" class="btn-stake">½</button>
              <button id="doubleBtn" class="btn-stake">×2</button>
            </div>
          </div>
          <button id="playBtn" class="btn play-btn">🎱 БРОСИТЬ</button>
        </div>

        <div id="gameStatus" class="game-status" aria-live="polite"></div>

      </div>
    </section>
  </main>

  <nav class="bottom-nav">
    <a href="games.html" class="nav-item" data-name="games"><span class="icon">🎮</span><span class="label">Games</span></a>
    <a href="wallet.html" class="nav-item" data-name="wallet"><span class="icon">💼</span><span class="label">Wallet</span></a>
    <a href="home.html" class="nav-item center" data-name=""><span class="icon">💎</span></a>
    <a href="bonus.html" class="nav-item" data-name="bonus"><span class="icon">🎁</span><span class="label">Bonus</span></a>
    <a href="menu.html" class="nav-item" data-name="menu"><span class="icon">☰</span><span class="label">Menu</span></a>
  </nav>

  <script src="js/app.js"></script>
  <script src="js/balance.js"></script>
  <script src="js/wallet-modal.js"></script>
  <script src="js/profile-dropdown.js"></script>
  <script src="js/plinko.js"></script>
  <script>
    function joinGame(){
      var socket = (window.Balance && Balance.getSocket) ? Balance.getSocket() : null;
      if(socket && socket.connected){
        socket.emit('join_game', 'plinko');
        window.addEventListener('beforeunload', function(){ socket.emit('leave_game', 'plinko'); });
      } else {
        setTimeout(joinGame, 500);
      }
    }
    setTimeout(joinGame, 1000);
  </script>
</body>
</html>
