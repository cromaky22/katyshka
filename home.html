  <script>
    var searchInput = document.getElementById('gameSearch');
    var gameCards = document.querySelectorAll('.game-card');
    if(searchInput){
      searchInput.addEventListener('input', function(){
        var q = this.value.trim().toLowerCase();
        gameCards.forEach(function(card){
          var name = card.querySelector('.game-card-name');
          var txt = name ? name.textContent.trim().toLowerCase() : '';
          card.style.display = (!q || txt.includes(q)) ? '' : 'none';
        });
      });
    }
    document.querySelectorAll('.filter-chip').forEach(function(chip){
      chip.addEventListener('click', function(){
        document.querySelectorAll('.filter-chip').forEach(function(c){ c.classList.remove('active'); });
        this.classList.add('active');
        var filter = this.dataset.filter;
        gameCards.forEach(function(card){
          if(filter === 'all'){ card.style.display = ''; }
          else if(filter === 'hot'){
            var hash = card.querySelector('.game-card-name').textContent.trim().charCodeAt(0);
            card.style.display = (hash % 2 === 0) ? '' : 'none';
          } else if(filter === 'new'){
            var hash = card.querySelector('.game-card-name').textContent.trim().charCodeAt(0);
            card.style.display = (hash % 3 === 0) ? '' : 'none';
          }
        });
      });
    });
    function updateOnlinePlayers(){
      var socket = (window.Balance && Balance.getSocket) ? Balance.getSocket() : null;
      if(!socket) return;
      socket.on('online_count', function(data){
        var count = data.count || 0;
        var games = document.querySelectorAll('.online-count');
        games.forEach(function(el){
          var portion = Math.max(1, Math.floor(count / games.length));
          var variance = Math.floor(Math.random() * 5) - 2;
          el.textContent = Math.max(1, portion + variance);
        });
      });
      socket.emit('get_online');
    }
    setTimeout(updateOnlinePlayers, 1500);
  </script>
