<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mini Casino — Главная</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="app-header">
    <div class="left-controls">
      <button class="btn-icon" aria-label="close">❀</button>
      <img src="assets/logo.png" alt="Logo" class="logo-small" onerror="this.style.display='none'">
    </div>
    <div class="header-title">KATYSHKA</div>
    <div class="right-controls" style="position:relative">
      <div class="balance-pill">
        <span class="wallet-icon">💠</span>
        <span class="balance-value">0.00</span>
        <span class="currency">$</span>
        <span class="caret">▾</span>
      </div>
      <button class="profile" id="profileBtn" title="Профиль" aria-label="Профиль"><img class="profile-icon" src="" alt="Аватар" onerror="this.style.display='none'"></button>
      <div class="profile-dropdown" id="profileDropdown">
        <div class="pd-header">
          <div class="pd-id-label">ID игрока</div>
          <div class="pd-id-value">
            <span id="pdUserId">—</span>
          </div>
        </div>
        <div class="pd-body">
          <a href="profile.html" class="pd-btn"><span class="pd-btn-icon">👤</span>Профиль<span class="pd-btn-arrow">→</span></a>
          <button class="pd-btn" id="pdPromoBtn"><span class="pd-btn-icon">🎟</span>Промокод<span class="pd-btn-arrow">→</span></button>
        </div>
      </div>
      <div class="pd-overlay" id="pdOverlay"></div>
    </div>
  </header>
  <main class="content">
    
    <section class="carousel-section">
      <div class="carousel" id="mainCarousel" aria-label="promo carousel">
        <div class="card"><img src="assets/1.png.jpg" alt="promo 1" class="card-img" onerror="this.style.display='none'"></div>
        <div class="card"><img src="assets/2.png.jpg" alt="promo 2" class="card-img" onerror="this.style.display='none'"></div>
        <div class="card"><!-- empty placeholder --></div>
      </div>
      <div class="carousel-dots" id="carouselDots" aria-hidden="false"></div>
    </section>
    <section class="quick-menu">
      <div class="search-row">
        <input id="gameSearch" type="search" placeholder="Поиск игр..." aria-label="Поиск игр" autocomplete="off">
        <button class="btn small">Провайдеры</button>
      </div>
      <div class="chips-row">
        <button class="chip"><span class="chip-emoji" aria-hidden="true"><svg class="chip-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path fill="currentColor" d="M3 3h8v8H3zM13 3h8v8h-8zM3 13h8v8H3zM13 13h8v8h-8z"/></svg></span>Все игры</button>
        <button class="chip"><span class="chip-emoji" aria-hidden="true"><svg class="chip-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path fill="currentColor" d="M3 3h6v18H3zM11 7h6v14h-6z"/></svg></span>Katyshka Originals</button>
        <button class="chip"><span class="chip-emoji" aria-hidden="true"><svg class="chip-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path fill="currentColor" d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg></span>Популярные</button>
      </div>
    </section>
    <section id="games" class="games-section">
      <h3>Режимы игр</h3>
      <div class="games-grid">
        <div class="game-tile">
          <a href="double.html" class="game-thumb-link" title="Double — играть" aria-label="Открыть Double">
            <img src="assets/double.jpg" alt="Double" class="game-thumb">
          </a>
          <div class="game-caption"><span class="game-name">Double</span></div>
        </div>
        <div class="game-tile">
          <a href="dreamcatcher.html" class="game-thumb-link" title="DreamCatcher — играть" aria-label="Открыть DreamCatcher">
            <img src="assets/dreamCatcher.jpg" alt="DreamCatcher" class="game-thumb">
          </a>
          <div class="game-caption"><span class="game-name">DreamCatcher</span></div>
        </div>
        <div class="game-tile">
          <a href="nvuti.html" class="game-thumb-link" title="Nvuti — играть" aria-label="Открыть Nvuti">
            <img src="assets/nvuti.jpg" alt="Nvuti" class="game-thumb">
          </a>
          <div class="game-caption"><span class="game-name">Nvuti</span></div>
        </div>
        <div class="game-tile">
          <a href="crash.html" class="game-thumb-link" title="Crash — играть" aria-label="Открыть Crash">
            <img src="assets/crash.jpg" alt="Crash" class="game-thumb">
          </a>
          <div class="game-caption"><span class="game-name">Crash</span></div>
        </div>
        <div class="game-tile">
          <a href="mines.html" class="game-thumb-link" title="Mines — играть" aria-label="Открыть Mines">
            <img src="assets/mines.jpg" alt="Mines" class="game-thumb">
          </a>
          <div class="game-caption"><span class="game-name">Mines</span></div>
        </div>
        <div class="game-tile">
          <a href="coinflip.html" class="game-thumb-link" title="Coinflip — играть" aria-label="Открыть Coinflip">
            <img src="assets/coinflip.jpg" alt="Coinflip" class="game-thumb">
          </a>
          <div class="game-caption"><span class="game-name">Coinflip</span></div>
        </div>
        <div class="game-tile">
          <a href="tower.html" class="game-thumb-link" title="Tower — играть" aria-label="Открыть Tower">
            <img src="assets/tower.jpg" alt="Tower" class="game-thumb">
          </a>
          <div class="game-caption"><span class="game-name">Tower</span></div>
        </div>
        <div class="game-tile">
          <a href="wheel.html" class="game-thumb-link" title="Wheel — играть" aria-label="Открыть Wheel">
            <img src="assets/wheel.jpg" alt="Wheel" class="game-thumb">
          </a>
          <div class="game-caption"><span class="game-name">Wheel</span></div>
        </div>
        <div class="game-tile">
          <a href="sweetbonanza.html" class="game-thumb-link" title="Sweet Bonanza — играть" aria-label="Открыть Sweet Bonanza">
            <img src="assets/sweetbonanza.jpg" alt="Sweet Bonanza" class="game-thumb">
          </a>
          <div class="game-caption"><span class="game-name">Sweet Bonanza</span></div>
        </div>
        <div class="game-tile">
          <a href="goldwest.html" class="game-thumb-link" title="GoldWest — играть" aria-label="Открыть GoldWest">
            <img src="assets/goldwest.jpg" alt="GoldWest" class="game-thumb">
          </a>
          <div class="game-caption"><span class="game-name">GoldWest</span></div>
        </div>
        <div class="game-tile">
          <a href="dice.html" class="game-thumb-link" title="Dice — играть" aria-label="Открыть Dice">
            <img src="assets/dice.jpg" alt="Dice" class="game-thumb">
          </a>
          <div class="game-caption"><span class="game-name">Dice</span></div>
        </div>
      </div>
    </section>
  </main>
  <nav class="bottom-nav">
    <a href="home.html#games" class="nav-item" data-name="games"><span class="icon">🎮</span><span class="label">Games</span></a>
    <a href="wallet.html" class="nav-item" data-name="wallet"><span class="icon">💼</span><span class="label">Wallet</span></a>
    <a href="home.html" class="nav-item center" data-name=""><span class="icon">💎</span></a>
    <a href="bonus.html" class="nav-item" data-name="bonus"><span class="icon">🎁</span><span class="label">Bonus</span></a>
    <a href="menu.html" class="nav-item" data-name="menu"><span class="icon">☰</span><span class="label">Menu</span></a>
  </nav>
  <script src="js/app.js"></script>
  <footer class="site-footer" role="contentinfo">
    <div class="footer-inner">
      <div class="footer-top">18+ · Все права защищены</div>
      <div class="footer-links"><a href="privacy.html">Политика конфиденциальности</a> · <a href="#">AML policy</a></div>
    </div>
  </footer>
</body>
</html>
