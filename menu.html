<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mini Casino — Menu</title>
  <link rel="stylesheet" href="css/style.css">

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<body>
  <header class="app-header">
    <div class="left-controls">
      <button class="btn-icon" aria-label="back">❀</button>
      <img src="assets/logo.png" alt="Logo" class="logo-small" onerror="this.style.display='none'">
    </div>
    <div class="header-title">KATYSHKA</div>
    <div class="right-controls" style="position:relative">
      <div class="balance-pill" id="balTrigger" style="cursor:pointer">
        <span class="wallet-icon">👛</span>
        <span class="balance-value" id="hbal">0.00</span>
        <span class="currency">$</span>
        <span class="caret">▾</span>
      </div>
      <button class="profile" id="profileBtn" title="Профиль" aria-label="Профиль"><img class="profile-icon" src="" alt="Аватар" onerror="this.style.display='none'"></button>
      <div class="profile-dropdown" id="profileDropdown">
        <div class="pd-header">
          <div class="pd-id-label">ID игрока</div>
          <div class="pd-id-value">
            <span id="pdUserId">—</span>
          </div>
        </div>
        <div class="pd-body">
          <a href="profile.html" class="pd-btn"><span class="pd-btn-icon">👤</span>Профиль<span class="pd-btn-arrow">→</span></a>
          <button class="pd-btn" id="pdPromoBtn"><span class="pd-btn-icon">🎟</span>Промокод<span class="pd-btn-arrow">→</span></button>
        </div>
      </div>
      <div class="pd-overlay" id="pdOverlay"></div>
    </div>
  </header>
  <main class="content">
    <section>
      <h3>Настройки и информация</h3>
      <div class="quick-menu">
        <div class="menu-actions">
          <a href="#" class="promo-btn" data-action="promo"><img src="assets/promo.png" alt="Активация промокода"></a>
          <a href="#" class="chip" data-action="ref">❖ Рефка</a>
          <a href="#" class="chip" data-action="faq">❓ FAQ</a>
          <a href="https://t.me/tabaef" target="_blank" rel="noopener noreferrer" class="chip">💬 Поддержка</a>
          <a href="https://t.me/milfacasino" target="_blank" rel="noopener noreferrer" class="chip">ℹ️ О нас</a>
        </div>
      </div>
    </section>
  </main>
  <!-- Promo modal -->
  <div class="promo-modal" id="promoModal" aria-hidden="true" style="display:none">
    <div class="promo-card">
      <button class="promo-close" id="promoClose" aria-label="Close">✕</button>
      <div class="promo-illustration"><img src="assets/promo_card.png" alt="promo" onerror="this.style.display='none'"></div>
      <h3>Активируй промокод и получи бонус</h3>
      <p class="promo-sub">Введите код</p>
      <input id="promoCodeInput" class="promo-input" placeholder="katyshka" maxlength="40">
      <div class="promo-actions">
        <button id="promoActivate" class="btn">Активировать</button>
      </div>
      <div id="promoMessage" class="promo-message" aria-live="polite"></div>
    </div>
  </div>
  <nav class="bottom-nav">
    <a href="home.html#games" class="nav-item" data-name="games"><span class="icon">🎮</span><span class="label">Games</span></a>
    <a href="wallet.html" class="nav-item" data-name="wallet"><span class="icon">💼</span><span class="label">Wallet</span></a>
    <a href="home.html" class="nav-item center" data-name=""><span class="icon">💎</span></a>
    <a href="bonus.html" class="nav-item" data-name="bonus"><span class="icon">🎁</span><span class="label">Bonus</span></a>
    <a href="menu.html" class="nav-item" data-name="menu"><span class="icon">☰</span><span class="label">Menu</span></a>
  </nav>
  <script src="js/balance.js"></script>
  <script src="js/app.js"></script>
  <script src="js/wallet-modal.js"></script>
</body>
</html>
