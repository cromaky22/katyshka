<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wheel — Nvuti</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/wheel.css">
</head>
<body class="page-wheel">
  <header class="app-header">
    <div class="left-controls"></div>
    <div class="header-title" style="margin-right:0">WHEEL</div>
    <div class="right-controls">
      <div class="balance-pill">
        <span class="wallet-icon">💠</span>
        <span class="balance-value">0.00</span>
        <span class="currency">$</span>
        <span class="caret">▾</span>
      </div>
      <a href="menu.html" class="profile" title="Профиль" aria-label="Профиль"><img class="profile-icon" src="" alt="Аватар" onerror="this.style.display='none'"></a>
    </div>
  </header>

  <main class="wheel-game">
    <div class="wheel-board">

      <div class="history-section">
        <div class="history-label">История игр</div>
        <div class="history-scroll" id="historyScroll"></div>
      </div>

      <div class="wheel-container">
        <div class="wheel-display" id="wheelDisplay">
          <div class="wheel-wrapper" id="wheelWrapper">
            <canvas id="wheelCanvas" width="600" height="600"></canvas>
            <div class="wheel-pointer">▼</div>
            <div class="wheel-center">
              <span class="wheel-timer-center" id="timerValue">20</span>
            </div>
            <div class="result-lens" id="resultLens"></div>
          </div>
        </div>
      </div>

      <div class="betting-table" id="bettingTable">
        <div class="betting-buttons">
          <button class="bet-btn btn-red" data-bet="red">Красное<div class="coef">x2</div></button>
          <button class="bet-btn btn-black" data-bet="black">Черное<div class="coef">x2</div></button>
        </div>
        <div class="betting-buttons">
          <button class="bet-btn btn-even" data-bet="odd">Четное<div class="coef">x2</div></button>
          <button class="bet-btn btn-odd" data-bet="notodd">Нечетное<div class="coef">x2</div></button>
        </div>
        <div class="betting-buttons">
          <button class="bet-btn btn-range1" data-bet="range1">1-18<div class="coef">x2</div></button>
          <button class="bet-btn btn-zero" data-bet="0">0<div class="coef">x36</div></button>
          <button class="bet-btn btn-range2" data-bet="range2">19-36<div class="coef">x2</div></button>
        </div>
        <div class="betting-buttons">
          <button class="bet-btn btn-range3" data-bet="range3">1-12<div class="coef">x3</div></button>
          <button class="bet-btn btn-range4" data-bet="range4">13-24<div class="coef">x3</div></button>
          <button class="bet-btn btn-range5" data-bet="range5">25-36<div class="coef">x3</div></button>
        </div>
        <button class="toggle-numbers-btn" id="toggleNumbersBtn">Поставить на число</button>
      </div>

      <div class="numbers-table hidden" id="numbersTable">
        <div class="numbers-grid" id="numbersGrid"></div>
        <button class="toggle-numbers-btn" id="toggleDefaultBtn">Назад</button>
      </div>

      <div class="active-bets" id="activeBets" style="display:none">
        <div class="section-title">Ваши ставки</div>
        <div class="active-bets-list" id="activeBetsList"></div>
      </div>

      <div class="stake-panel">
        <div class="stake-header">
          <label>Ставка</label>
          <span class="stake-range">От $0.50 до $200</span>
        </div>
        <div class="quick-bet-buttons">
          <button class="quick-bet-btn" data-amount="0.5"><span class="dollar">$</span>+0.5</button>
          <button class="quick-bet-btn" data-amount="1"><span class="dollar">$</span>+1</button>
          <button class="quick-bet-btn" data-amount="5"><span class="dollar">$</span>+5</button>
          <button class="quick-bet-btn" data-amount="10"><span class="dollar">$</span>+10</button>
        </div>
        <div class="stake-input-group">
          <input type="number" id="stakeInput" value="1" min="0.5" max="200" step="0.5">
          <div class="stake-controls">
            <button class="stake-btn" id="halfBtn">½</button>
            <button class="stake-btn" id="doubleBtn">×2</button>
          </div>
        </div>
      </div>

      <div class="win-announcement" id="winAnnouncement" style="display:none">
        <div class="win-title">🎉 Победители</div>
        <div class="win-list" id="winList"></div>
      </div>

      <div class="game-status" id="gameStatus">Подключение...</div>

      <div class="all-players-bets" id="allPlayersBets">
        <div class="section-title">Ставки игроков на этот раунд</div>
        <div class="all-bets-list" id="allPlayersBetsList"></div>
      </div>
    </div>
  </main>

  <nav class="bottom-nav">
    <a href="home.html#games" class="nav-item"><span class="nav-emoji">🎮</span><span class="nav-label">Games</span></a>
    <a href="wallet.html" class="nav-item"><span class="nav-emoji">💼</span><span class="nav-label">Wallet</span></a>
    <a href="home.html" class="nav-item"><span class="nav-emoji">💎</span></a>
    <a href="bonus.html" class="nav-item"><span class="nav-emoji">🎁</span><span class="nav-label">Bonus</span></a>
    <a href="menu.html" class="nav-item"><span class="nav-emoji">☰</span><span class="nav-label">Menu</span></a>
  </nav>

  <script src="/socket.io/socket.io.js"></script>
  <script src="js/wheel.js"></script>
</body>
</html>
