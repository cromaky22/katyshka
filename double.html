<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Double — Nvuti</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/double.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body class="page-double">
  <header class="app-header">
    <div class="left-controls"></div>
    <div class="header-title">DOUBLE</div>
    <div class="right-controls" style="position:relative">
      <div class="balance-pill">
        <span class="wallet-icon">💠</span>
        <span class="balance-value">0.00</span>
        <span class="currency">$</span>
      </div>
      <button class="profile" id="profileBtn" title="Профиль" aria-label="Профиль"><img class="profile-icon" src="" alt="Аватар" onerror="this.style.display='none'"></button>
      <div class="profile-dropdown" id="profileDropdown">
        <div class="pd-header">
          <div class="pd-id-label">ID игрока</div>
          <div class="pd-id-value"><span id="pdUserId">—</span></div>
        </div>
        <div class="pd-body">
          <a href="profile.html" class="pd-btn"><span class="pd-btn-icon">👤</span>Профиль<span class="pd-btn-arrow">→</span></a>
          <button class="pd-btn" id="pdPromoBtn"><span class="pd-btn-icon">🎟</span>Промокод<span class="pd-btn-arrow">→</span></button>
        </div>
      </div>
      <div class="pd-overlay" id="pdOverlay"></div>
    </div>
  </header>

  <main class="content">
    <section class="double-game">
      <div class="double-board">

        <!-- History -->
        <div class="history-scroll" id="historyScroll"></div>

        <!-- Wheel -->
        <div class="wheel-container">
          <div class="wheel-wrapper">
            <canvas id="wheelCanvas" width="260" height="260"></canvas>
            <div class="wheel-pointer">▼</div>
            <div class="wheel-center"><span class="result-lens" id="resultLens"></span></div>
          </div>
        </div>

        <!-- Status -->
        <div class="game-status" id="gameStatus">Загрузка...</div>

        <!-- Bets -->
        <div class="bets-panel">
          <div class="bets-grid">
            <button class="bet-btn bet-blue" data-color="blue" data-mult="2"><span class="bet-multiplier">x2</span><span class="bet-name">Синий</span></button>
            <button class="bet-btn bet-yellow" data-color="yellow" data-mult="3"><span class="bet-multiplier">x3</span><span class="bet-name">Жёлтый</span></button>
            <button class="bet-btn bet-orange" data-color="orange" data-mult="5"><span class="bet-multiplier">x5</span><span class="bet-name">Оранжевый</span></button>
            <button class="bet-btn bet-green" data-color="green" data-mult="10"><span class="bet-multiplier">x10</span><span class="bet-name">Зелёный</span></button>
          </div>
        </div>

        <!-- Stake -->
        <div class="stake-panel">
          <div class="stake-header">
            <span>Ставка</span>
            <span>Баланс: <span class="currency-sign-green" id="doubleBalance">$0.00</span></span>
          </div>
          <div class="stake-row">
            <input id="stakeInput" type="number" min="0.1" step="0.1" value="0.1">
            <div class="stake-buttons">
              <button class="btn-stake" id="halfBtn">½</button>
              <button class="btn-stake" id="doubleBtn">×2</button>
            </div>
          </div>
          <div class="quick-bet-buttons">
            <button class="quick-bet-btn" data-amount="1"><span class="dollar">$</span>1</button>
            <button class="quick-bet-btn" data-amount="5"><span class="dollar">$</span>5</button>
            <button class="quick-bet-btn" data-amount="10"><span class="dollar">$</span>10</button>
            <button class="quick-bet-btn" data-amount="50"><span class="dollar">$</span>50</button>
          </div>
          <button class="play-btn" id="playBtn">Играть</button>
        </div>

      </div>
    </section>
  </main>

  <nav class="bottom-nav">
    <a href="home.html#games" class="nav-item" data-name="games"><span class="icon">🎮</span><span class="label">Games</span></a>
    <a href="wallet.html" class="nav-item" data-name="wallet"><span class="icon">💼</span><span class="label">Wallet</span></a>
    <a href="home.html" class="nav-item center" data-name=""><span class="icon">💎</span></a>
    <a href="bonus.html" class="nav-item" data-name="bonus"><span class="icon">🎁</span><span class="label">Bonus</span></a>
    <a href="menu.html" class="nav-item" data-name="menu"><span class="icon">☰</span><span class="label">Menu</span></a>
  </nav>

  <script src="js/app.js"></script>
  <script src="js/balance.js"></script>
  <script src="js/double.js"></script>
</body>
</html>
