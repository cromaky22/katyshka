<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Double — Nvuti</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/double.css">
</head>
<body class="page-double">
  <header class="app-header">
    <div class="left-controls"></div>
    <div class="header-title">DOUBLE</div>
    <div class="right-controls">
      <div class="balance-pill">
        <span class="wallet-icon">💠</span>
        <span class="balance-value">0.00</span>
        <span class="currency">$</span>
      </div>
      <a href="menu.html" class="profile" title="Профиль" aria-label="Профиль"><img class="profile-icon" src="" alt="Аватар" onerror="this.style.display='none'"></a>
    </div>
  </header>

  <main class="content">
    <section class="double-game">
      <div class="double-board">

        <div class="history-scroll" id="historyScroll"></div>

        <div class="wheel-container">
          <div class="wheel-wrapper">
            <canvas id="doubleWheel" width="600" height="600"></canvas>
            <div class="wheel-pointer">▼</div>
            <div class="wheel-center" id="wheelCenter">
              <span class="result-lens" id="resultLens"></span>
            </div>
          </div>
        </div>

        <div class="bets-panel">
          <div class="bets-grid">
            <button class="bet-btn bet-blue" data-color="blue">
              <span class="bet-multiplier">x2</span>
              <span class="bet-name">Blue</span>
            </button>
            <button class="bet-btn bet-yellow" data-color="yellow">
              <span class="bet-multiplier">x3</span>
              <span class="bet-name">Yellow</span>
            </button>
            <button class="bet-btn bet-orange" data-color="orange">
              <span class="bet-multiplier">x5</span>
              <span class="bet-name">Orange</span>
            </button>
            <button class="bet-btn bet-green" data-color="green">
              <span class="bet-multiplier">x50</span>
              <span class="bet-name">Green</span>
            </button>
          </div>
        </div>

        <div class="stake-panel">
          <div class="stake-header">
            <label>Ставка</label>
            <span class="stake-range">От <span class="currency-sign-green">$</span>0.50 до <span class="currency-sign-green">$</span>200</span>
          </div>
          <div class="quick-bet-buttons">
            <button class="quick-bet-btn" data-amount="0.5"><span class="dollar">$</span>+0.5</button>
            <button class="quick-bet-btn" data-amount="1"><span class="dollar">$</span>+1</button>
            <button class="quick-bet-btn" data-amount="5"><span class="dollar">$</span>+5</button>
            <button class="quick-bet-btn" data-amount="10"><span class="dollar">$</span>+10</button>
          </div>
          <div class="stake-row">
            <input id="stakeInput" type="number" min="0.5" max="200" step="0.5" value="1">
            <div class="stake-buttons">
              <button id="halfBtn" class="btn-stake">½</button>
              <button id="doubleBtn" class="btn-stake">×2</button>
            </div>
          </div>
          <button id="playBtn" class="btn play-btn">🎰 ИГРАТЬ</button>
        </div>

        <div id="gameStatus" class="game-status" aria-live="polite"></div>

      </div>
    </section>
  </main>

  <nav class="bottom-nav">
    <a href="home.html#games" class="nav-item" data-name="games"><span class="icon">🎮</span><span class="label">Games</span></a>
    <a href="wallet.html" class="nav-item" data-name="wallet"><span class="icon">💼</span><span class="label">Wallet</span></a>
    <a href="home.html" class="nav-item center" data-name=""><span class="icon">💎</span></a>
    <a href="bonus.html" class="nav-item" data-name="bonus"><span class="icon">🎁</span><span class="label">Bonus</span></a>
    <a href="menu.html" class="nav-item" data-name="menu"><span class="icon">☰</span><span class="label">Menu</span></a>
  </nav>

  <script src="js/app.js"></script>
  <script src="js/double.js"></script>
</body>
</html>
