<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Mines — Nvuti</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/mines.css">
</head>
<body class="page-mines">
  <header class="app-header">
    <div class="left-controls"></div>
    <div class="header-title">Mines</div>
    <div class="right-controls">
      <div class="balance-pill">
        <span class="wallet-icon">💠</span>
        <span class="balance-value">0.00</span>
        <span class="currency">$</span>
        <span class="caret">▾</span>
      </div>
    </div>
  </header>

  <main class="content">
    <section class="mines">
      <div class="mines-board">
        <!-- compact panels moved to top; original side panels removed for compact layout -->

        <div class="center-area">
              
          <div class="compact-panels">
            <div class="compact-item">
              <div class="compact-icon">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs><linearGradient id="g2" x1="0" x2="1" y1="0" y2="1"><stop offset="0%" stop-color="#9cf0ff"/><stop offset="100%" stop-color="#6ad1ff"/></linearGradient></defs><path fill="url(#g2)" d="M12 2 2 8l4 9 6 3 6-3 4-9-10-6z"/></svg>
              </div>
              <div class="compact-label">Шаг</div>
              <div class="compact-count" id="compactStepCount">20</div>
            </div>
            <div class="compact-item">
              <div class="compact-icon">💣</div>
              <div class="compact-label">МИНЫ</div>
              <div class="compact-count" id="compactMinesCount">5</div>
            </div>
          </div>
          <div class="top-multipliers-wrap">
            <button id="multLeft" class="mult-btn" aria-label="prev">◀</button>
            <div class="top-multipliers" id="multipliersList" role="list" aria-label="multipliers"></div>
            <button id="multRight" class="mult-btn" aria-label="next">▶</button>
          </div>
 

          <div class="field-wrapper">
            <div class="grid" id="minesGrid" role="grid" aria-label="mines grid"></div>

            <div class="controls">
            <div class="controls-row">
              <label>Ставка</label>
              <input id="minesStake" type="number" min="0.5" max="200" step="0.5" value="1">
              <label>Мины</label>
              <div class="mines-select-wrap">
                <select id="minesCount">
                  <!-- mines options from 2 to 24; default 5 -->
                  <option value="2">2</option>
                  <option value="3">3</option>
                  <option value="4">4</option>
                  <option value="5" selected>5</option>
                  <option value="6">6</option>
                  <option value="7">7</option>
                  <option value="8">8</option>
                  <option value="9">9</option>
                  <option value="10">10</option>
                  <option value="11">11</option>
                  <option value="12">12</option>
                  <option value="13">13</option>
                  <option value="14">14</option>
                  <option value="15">15</option>
                  <option value="16">16</option>
                  <option value="17">17</option>
                  <option value="18">18</option>
                  <option value="19">19</option>
                  <option value="20">20</option>
                  <option value="21">21</option>
                  <option value="22">22</option>
                  <option value="23">23</option>
                  <option value="24">24</option>
                </select>
                <button id="openMinesPicker" class="open-picker-btn" aria-label="Открыть выбор мин">▼</button>
              </div>
              <div class="play-area">
                <button id="minesPlay" class="btn play-btn">ИГРАТЬ</button>
                <button id="minesCashout" class="btn cashout-btn" style="display:none;background:linear-gradient(180deg,#ffd54d,#ffb400);color:#2b1f00;font-weight:900">ЗАБРАТЬ</button>
              </div>
              <!-- Выигрыш теперь отображается на кнопке 'Забрать' во время раунда -->
              <span id="minesWin" style="display:none"></span>
            </div>
            <div class="hint">Нажмите "Играть", затем открывайте ячейки по одной. Если наткнётесь на мину — вы проигрываете.</div>
            <div id="minesStatus" class="mines-status">Ставка не сделана</div>
          </div>
          <!-- Mines picker popup (grid selector 2..24) -->
          <div id="minesPicker" class="mines-picker" style="display:none;" aria-hidden="true">
            <div class="mines-picker-inner">
              <div class="mines-picker-grid" id="minesPickerGrid" role="grid"></div>
              <div class="mines-picker-actions"><button id="closeMinesPicker" class="btn small">Закрыть</button></div>
            </div>
          </div>
          </div>
          <!-- Mobile/compact stake panel moved here to appear under the game field on small screens -->
          <div class="mines-bottom" id="minesBottom">
            <div class="bottom-left">
              <div class="panel-stake">
                <div class="panel-row">
                  <div class="label">Ставка</div>
                  <div class="value"><span class="balance-small">$</span> <span id="stakeValueTop">1</span></div>
                </div>
                <div class="panel-controls">
                  <button class="quick-btn" id="halfBtn">1/2</button>
                  <button class="quick-btn" id="doubleBtn">x2</button>
                  <input id="minesStakeBottom" type="number" min="0.5" max="200" step="0.5" value="1">
                </div>
              </div>
            </div>
            <div class="bottom-center">
              <div class="panel-mines">
                  <div class="panel-row">
                    <div class="label">Мины</div>
                    <div class="value"><span id="minesCountDisplay">5</span></div>
                  </div>
                <div class="panel-controls">
                    <div class="mines-select-wrap">
                    <select id="minesCountBottom">
                      <option value="2">2</option>
                      <option value="3">3</option>
                      <option value="4">4</option>
                      <option value="5" selected>5</option>
                      <option value="6">6</option>
                      <option value="7">7</option>
                      <option value="8">8</option>
                      <option value="9">9</option>
                      <option value="10">10</option>
                      <option value="11">11</option>
                      <option value="12">12</option>
                      <option value="13">13</option>
                      <option value="14">14</option>
                      <option value="15">15</option>
                      <option value="16">16</option>
                      <option value="17">17</option>
                      <option value="18">18</option>
                      <option value="19">19</option>
                      <option value="20">20</option>
                      <option value="21">21</option>
                      <option value="22">22</option>
                      <option value="23">23</option>
                      <option value="24">24</option>
                    </select>
                    <button id="openMinesPickerBottom" class="open-picker-btn" aria-label="Открыть выбор мин">▼</button>
                    </div>
                </div>
              </div>
            </div>
            <div class="bottom-right">
              <button id="minesPlayBottom" class="btn play-btn large">ИГРАТЬ</button>
            </div>
          </div>
        </div>

        <!-- right side panel removed (compact top panels used) -->
      </div>
    </section>
  </main>

  <nav class="bottom-nav">
    <a href="home.html#games" class="nav-item" data-name="games"><span class="icon">🎮</span><span class="label">Games</span></a>
    <a href="wallet.html" class="nav-item" data-name="wallet"><span class="icon">💼</span><span class="label">Wallet</span></a>
    <a href="home.html" class="nav-item center" data-name=""><span class="icon">💎</span></a>
    <a href="bonus.html" class="nav-item" data-name="bonus"><span class="icon">🎁</span><span class="label">Bonus</span></a>
    <a href="menu.html" class="nav-item" data-name="menu"><span class="icon">☰</span><span class="label">Menu</span></a>
  </nav>



  <script src="js/app.js"></script>
  <script src="js/mines.js"></script>
</body>
</html>
