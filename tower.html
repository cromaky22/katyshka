<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Tower — Tower</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/tower.css">

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<body class="page-tower">
  <header class="app-header">
    <div class="left-controls"></div>
    <div class="header-title">Tower</div>
    <div class="right-controls" style="position:relative">
      <div class="balance-pill" id="balTrigger" style="cursor:pointer">
        <span class="wallet-icon">👛</span>
        <span class="balance-value" id="hbal">0.00</span>
        <span class="currency">$</span>
        <span class="caret">▾</span>
      </div>
      <button class="profile" id="profileBtn" title="Профиль" aria-label="Профиль"><img class="profile-icon" src="" alt="Аватар" onerror="this.style.display='none'"></button>
      <div class="profile-dropdown" id="profileDropdown">
        <div class="pd-header">
          <div class="pd-id-label">ID игрока</div>
          <div class="pd-id-value">
            <span id="pdUserId">—</span>
          </div>
        </div>
        <div class="pd-body">
          <a href="profile.html" class="pd-btn"><span class="pd-btn-icon">👤</span>Профиль<span class="pd-btn-arrow">→</span></a>
          <button class="pd-btn" id="pdPromoBtn"><span class="pd-btn-icon">🎟</span>Промокод<span class="pd-btn-arrow">→</span></button>
        </div>
      </div>
      <div class="pd-overlay" id="pdOverlay"></div>
    </div>
  </header>

  <main class="content">
    <section class="tower">
      <div class="tower-board">
        
        <!-- Панель ставки (state 1) -->
        <div class="stake-panel" id="stakePanel">
          <div class="stake-header">
            <label>Выберите количество бомб</label>
          </div>

          <!-- Контрольные кнопки бомб -->
          <div class="bombs-control">
            <button id="bombMinus" class="bomb-control-btn">−</button>
            <div class="bombs-display">
              <div class="bomb-icons" id="bombIcons"></div>
              <div class="bomb-count">
                <span id="bombCountText">1</span> <span id="bombCountLabel">БОМБА</span>
              </div>
            </div>
            <button id="bombPlus" class="bomb-control-btn">+</button>
          </div>

          <!-- Таблица коэффициентов -->
          <div class="coefs-scroll">
            <div id="coefsContainer"></div>
          </div>

          <div class="stake-header">
            <label>Ставка</label>
          </div>
          
          <!-- Быстрые кнопки ставок -->
          <div class="quick-bet-buttons">
            <button class="quick-bet-btn" data-amount="1">+1<span style="color:var(--accent-green)">$</span></button>
            <button class="quick-bet-btn" data-amount="3">+3<span style="color:var(--accent-green)">$</span></button>
            <button class="quick-bet-btn" data-amount="5">+5<span style="color:var(--accent-green)">$</span></button>
            <button class="quick-bet-btn" data-amount="10">+10<span style="color:var(--accent-green)">$</span></button>
          </div>
          
          <div class="stake-row">
            <input id="stakeInput" type="number" min="0.1" step="0.1" value="0.1">
            <div class="stake-buttons">
              <button id="halfBtn" class="btn-stake">/2</button>
              <button id="doubleBtn" class="btn-stake">x2</button>
            </div>
          </div>
          <button id="playBtn" class="btn play-btn">ПОСТАВИТЬ</button>
        </div>

        <!-- Панель игры (state >= 2) -->
        <div class="game-panel" id="gamePanel" style="display:none">
          <div class="tower-container">
            <!-- Левая панель с уровнями -->
            <div class="levels-sidebar" id="levelsSidebar"></div>
            
            <!-- Сетка ячеек -->
            <div class="tower-grid"></div>
          </div>

          <!-- Статус выигрыша -->
          <div class="result-status">
            <div id="gameStatus" class="game-status" aria-live="polite"></div>
            <div class="winnings-display">
              <div id="gameStatusTitle">Ваш выигрыш</div>
              <div id="winningsAmount" class="winnings-amount">0.00$</div>
            </div>
          </div>

          <!-- Кнопки действий -->
          <button id="collectBtn" class="btn play-btn" style="display:none">ЗАБРАТЬ ВЫИГРЫШ</button>
          <button id="continueBtn" class="btn play-btn" style="display:none">ПРОДОЛЖИТЬ</button>
        </div>

        <!-- История игр -->
        <div class="history-panel">
          <div class="history-header">ИСТОРИЯ ИГР</div>
          <div class="history-scroll" id="historyScroll">
            <!-- История добавляется динамически -->
          </div>
        </div>

      </div>
    </section>
  </main>

  <nav class="bottom-nav">
    <a href="games.html" class="nav-item" data-name="games"><span class="icon">🎮</span><span class="label">Games</span></a>
    <a href="wallet.html" class="nav-item" data-name="wallet"><span class="icon">💼</span><span class="label">Wallet</span></a>
    <a href="home.html" class="nav-item center" data-name=""><span class="icon">💎</span></a>
    <a href="bonus.html" class="nav-item" data-name="bonus"><span class="icon">🎁</span><span class="label">Bonus</span></a>
    <a href="menu.html" class="nav-item" data-name="menu"><span class="icon">☰</span><span class="label">Menu</span></a>
  </nav>

  <script src="js/app.js"></script><script src="js/promo-modal.js"></script>
  <script src="js/balance.js"></script>
  <script src="js/wallet-modal.js"></script>
  <script src="js/profile-dropdown.js"></script>
  <script src="js/tower.js"></script>
  <script>
    function joinGame(){
      var socket = (window.Balance && Balance.getSocket) ? Balance.getSocket() : null;
      if(socket && socket.connected){
        socket.emit('join_game', 'tower');
        window.addEventListener('beforeunload', function(){ socket.emit('leave_game', 'tower'); });
      } else {
        setTimeout(joinGame, 500);
      }
    }
    setTimeout(joinGame, 1000);
  </script>
</body>
</html>
