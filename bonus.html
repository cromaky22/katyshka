<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Бонус — KATYSHKA</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body.page-bonus::before{
      content:'';position:fixed;top:-100px;left:-100px;right:-100px;bottom:-100px;pointer-events:none;z-index:1;
      background:url('../assets/ssa.jpg') center/cover no-repeat;
      opacity:0.5;
    }
    body.page-bonus::after{
      content:'';position:fixed;inset:0;pointer-events:none;z-index:1;
      background:linear-gradient(160deg,rgba(6,0,18,0.7) 0%,rgba(13,5,32,0.6) 40%,rgba(10,21,37,0.65) 70%,rgba(6,0,18,0.7) 100%);
    }
    .bonus-section{padding:16px 16px 100px;max-width:420px;margin:0 auto;display:flex;flex-direction:column;gap:14px;position:relative;z-index:2}
    .subscribe-box{background:linear-gradient(135deg,rgba(21,97,255,0.3),rgba(46,227,107,0.2));border-radius:14px;padding:14px;border:1px solid rgba(255,255,255,0.1)}
    .subscribe-title{font-size:14px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:6px}
    .subscribe-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:10px 16px;border-radius:10px;border:none;font-size:14px;font-weight:700;cursor:pointer;background:linear-gradient(135deg,#1559ff,#2b84ea);color:#fff;text-decoration:none;transition:all 0.2s}
    .subscribe-btn .telega-icon{width:36px;height:36px;border-radius:50%;object-fit:cover;flex-shrink:0}
    .subscribe-btn:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(21,89,255,0.3)}
    .subscribe-btn.done{background:#2a2a3a;color:#888;cursor:default;pointer-events:none}
    .subscribe-btn.done:hover{transform:none;box-shadow:none}
    .subscribe-claim{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:12px;border-radius:10px;border:none;font-size:14px;font-weight:700;cursor:pointer;background:linear-gradient(135deg,#ffd700,#ff6b9d);color:#000;margin-top:8px;transition:all 0.2s}
    .subscribe-claim:hover{transform:translateY(-1px)}
    .subscribe-claim:disabled{opacity:0.4;cursor:not-allowed;transform:none}
    .subscribe-status{margin-top:8px;padding:8px 10px;border-radius:8px;font-size:12px;font-weight:600;display:none;text-align:center}
    .subscribe-status.show{display:block}
    .subscribe-status.success{background:rgba(46,227,107,0.12);color:#2ee36b;border:1px solid rgba(46,227,107,0.25)}
    .subscribe-status.error{background:rgba(244,67,54,0.12);color:#f44336;border:1px solid rgba(244,67,54,0.25)}
    .wheel-card{background:rgba(12,14,32,0.7);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;border:1px solid rgba(255,255,255,0.08)}
    .wheel-header{text-align:center}
    .wheel-title{font-size:20px;font-weight:900}
    .wheel-sub{font-size:12px;color:var(--muted);margin-top:2px}
    .wheel-container{position:relative;width:100%;max-width:280px;margin:0 auto}
    .wheel-canvas{width:100%;aspect-ratio:1;border-radius:50%;box-shadow:0 0 0 6px rgba(255,255,255,0.08),0 0 40px rgba(107,47,160,0.4);background:#0a0118;display:block}
    .wheel-pointer{position:absolute;top:6px;left:50%;transform:translateX(-50%) rotate(180deg);font-size:24px;color:#ffd700;z-index:10;filter:drop-shadow(0 4px 8px rgba(0,0,0,0.6));pointer-events:none}
    .bonus-status{padding:10px;border-radius:10px;font-weight:600;font-size:13px;text-align:center;background:rgba(10,10,30,0.6);border:1px solid rgba(255,255,255,0.08)}
    .bonus-status.win{background:rgba(76,175,80,0.15);color:#4caf50;border-color:rgba(76,175,80,0.4)}
    .bonus-status.wait{background:rgba(255,193,7,0.15);color:#ffc107;border-color:rgba(255,193,7,0.4)}
    .timer-block{text-align:center;padding:4px 0}
    .timer-big{font-size:32px;font-weight:900;color:#ffd700}
    .timer-label{font-size:11px;color:var(--muted);margin-top:2px}
    .bonus-btn{width:100%;padding:14px;border-radius:12px;border:none;font-size:16px;font-weight:800;cursor:pointer;background:linear-gradient(135deg,#ff6b9d,#ffd700);color:#000;text-transform:uppercase;letter-spacing:1px;transition:all 0.2s;box-shadow:0 8px 24px rgba(255,107,157,0.3);margin-top:4px}
    .bonus-btn:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(255,107,157,0.4)}
    .bonus-btn:disabled{opacity:0.35;cursor:not-allowed;transform:none;box-shadow:none}
    @media(max-width:380px){
      .bonus-section{padding:12px 10px 90px}
      .wheel-title{font-size:18px}
      .subscribe-box,.wheel-card{padding:10px}
      .wheel-container{max-width:240px}
      .timer-big{font-size:28px}
    }
  </style>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body class="page-bonus">

  <header class="app-header">
    <div class="left-controls" style="width:32px"></div>
    <div class="header-title" style="color:var(--accent)">🎁 BONUS</div>
    <div class="right-controls" style="position:relative">
      <div class="balance-pill" id="balTrigger" style="cursor:pointer">
        <span class="wallet-icon">👛</span>
        <span class="balance-value" id="hbal">0.00</span>
        <span class="currency">$</span>
        <span class="caret">▾</span>
      </div>
      <button class="profile" id="profileBtn" title="Профиль" aria-label="Профиль"><img class="profile-icon" id="profileImg" src="" alt="Аватар" onerror="this.style.display='none'"></button>
      <div class="profile-dropdown" id="profileDropdown">
        <div class="pd-header">
          <div class="pd-id-label">ID игрока</div>
          <div class="pd-id-value"><span id="pdUserId">—</span></div>
        </div>
        <div class="pd-body">
          <a href="profile.html" class="pd-btn"><span class="pd-btn-icon">👤</span>Профиль<span class="pd-btn-arrow">→</span></a>
          <button class="pd-btn" id="pdPromoBtn"><span class="pd-btn-icon">🎟</span>Промокод<span class="pd-btn-arrow">→</span></button>
        </div>
      </div>
      <div class="pd-overlay" id="pdOverlay"></div>
    </div>
  </header>

  <main class="bonus-section" style="position:relative;z-index:2">

    <div class="subscribe-box">
      <div class="subscribe-title">💎 Подпишитесь на канал и получите $0.3</div>
      <a href="#" class="subscribe-btn no-loader" id="subscribeBtn">
         <img class="telega-icon" src="assets/telega-small.jpg" alt="Telegram" onerror="this.style.display='none'">
        <span>ПОДПИСАТЬСЯ</span>
      </a>
      <button class="subscribe-claim" id="claimSubBtn" style="display:none">🎁 ПОЛУЧИТЬ $0.3</button>
      <div class="subscribe-status" id="subStatus"></div>
    </div>

    <div class="wheel-card">
      <div class="wheel-header">
        <div class="wheel-title">🎡 Колесо Удачи</div>
        <div class="wheel-sub">Крути раз в день — выигрывай до $10!</div>
      </div>
      <div class="wheel-container">
        <canvas id="bonusWheel" class="wheel-canvas"></canvas>
        <div class="wheel-pointer">▼</div>
      </div>
      <div class="bonus-status" id="bonusStatus">Нажмите кнопку чтобы крутить!</div>
      <div class="timer-block" id="timerBlock" style="display:none">
        <div class="timer-big" id="timerVal">00:00:00</div>
        <div class="timer-label">до следующего бонуса</div>
      </div>
      <button class="bonus-btn" id="spinBtn">🎰 КРУТИТЬ</button>
    </div>

  </main>

  <nav class="bottom-nav">
    <a href="games.html" class="nav-item" data-name="games"><span class="icon">🎮</span><span class="label">Games</span></a>
    <a href="wallet.html" class="nav-item" data-name="wallet"><span class="icon">💼</span><span class="label">Wallet</span></a>
    <a href="home.html" class="nav-item center" data-name=""><span class="icon">💎</span></a>
    <a href="bonus.html" class="nav-item active" data-name="bonus"><span class="icon">🎁</span><span class="label">Bonus</span></a>
    <a href="menu.html" class="nav-item" data-name="menu"><span class="icon">☰</span><span class="label">Menu</span></a>
  </nav>

  <script src="js/app.js"></script><script src="js/telegram-user.js"></script>
  <script src="js/promo-modal.js"></script>
  <script src="js/balance.js"></script>
  <script>
  (function(){
    // === USER ID ===
    var uid = localStorage.getItem('tg_uid') || '';
    try {
      var tg = window.Telegram && window.Telegram.WebApp;
      if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
        uid = String(tg.initDataUnsafe.user.id);
        localStorage.setItem('tg_uid', uid);
      }
    } catch(e) {}
    if (!uid) uid = 'u' + Math.random().toString(36).substr(2, 9);

    // === SUBSCRIBE LOGIC ===
    var subBtn = document.getElementById('subscribeBtn');
    var claimSubBtn = document.getElementById('claimSubBtn');
    var subStatus = document.getElementById('subStatus');

    function showSubStatus(msg, type) {
      subStatus.style.display = 'block';
      subStatus.textContent = msg;
      subStatus.className = 'subscribe-status show ' + (type || '');
    }

    function setSubscribedUI() {
      subBtn.classList.add('done');
      subBtn.innerHTML = '<span>✅ ВЫ ПОДПИСАНЫ</span>';
      subBtn.style.pointerEvents = 'none';
    }

    // Check subscription status on load
    function checkSub() {
      if (localStorage.getItem('sub_claimed_' + uid)) {
        setSubscribedUI();
        claimSubBtn.style.display = 'none';
        showSubStatus('✅ Награда уже получена', 'success');
        return;
      }
      if (localStorage.getItem('sub_ok_' + uid)) {
        setSubscribedUI();
        claimSubBtn.style.display = 'flex';
        return;
      }
      fetch('/api/check-subscribe/' + uid)
        .then(function(r) { return r.json(); })
        .then(function(data) {
          if (data.subscribed) {
            localStorage.setItem('sub_ok_' + uid, '1');
            setSubscribedUI();
            claimSubBtn.style.display = 'flex';
          }
        }).catch(function(){});
    }
    checkSub();

    // Open Telegram channel
    subBtn.addEventListener('click', function(e) {
      e.preventDefault();
      e.stopPropagation();
      try {
        var tgApp = window.Telegram && window.Telegram.WebApp;
        if (tgApp && tgApp.openTelegramLink) {
          tgApp.openTelegramLink('https://t.me/milfacasino');
        } else {
          window.open('https://t.me/milfacasino', '_blank');
        }
      } catch(err) {
        window.open('https://t.me/milfacasino', '_blank');
      }
      return false;
    });

    // Claim reward
    claimSubBtn.addEventListener('click', function() {
      if (claimSubBtn.disabled) return;
      claimSubBtn.disabled = true;
      showSubStatus('⏳ Проверяем...', '');

      fetch('/api/bonus/subscribe', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({userId: uid})
      })
      .then(function(r) { return r.json(); })
      .then(function(data) {
           if (data.ok) {
           localStorage.setItem('sub_claimed_' + uid, '1');
           localStorage.removeItem('sub_ok_' + uid);
           setSubscribedUI();
           claimSubBtn.style.display = 'none';
           showSubStatus('🎉 Вам начислено $0.3!', 'success');
        } else if (data.error === 'not_subscribed') {
          showSubStatus('❌ Вы не подписаны на канал!', 'error');
          claimSubBtn.disabled = false;
        } else if (data.error === 'already_claimed') {
          localStorage.setItem('sub_claimed_' + uid, '1');
          setSubscribedUI();
          claimSubBtn.style.display = 'none';
          showSubStatus('✅ Награда уже была получена ранее', 'success');
        } else {
          showSubStatus('❌ ' + (data.error || 'Ошибка'), 'error');
          claimSubBtn.disabled = false;
        }
      })
      .catch(function() {
        showSubStatus('❌ Ошибка соединения', 'error');
        claimSubBtn.disabled = false;
      });
    });

    // === WHEEL LOGIC ===
    var canvas = document.getElementById('bonusWheel');
    var ctx = canvas.getContext('2d');
    var spinBtn = document.getElementById('spinBtn');
    var bonusStatus = document.getElementById('bonusStatus');
    var timerBlock = document.getElementById('timerBlock');
    var timerVal = document.getElementById('timerVal');

    var SECTORS = [
      { label: '$0.01', payout: 0.01, color: '#1a1a2e' },
      { label: '$0.10', payout: 0.10, color: '#2d2d44' },
      { label: '$0.50', payout: 0.50, color: '#1a1a2e' },
      { label: '$0.02', payout: 0.02, color: '#2d2d44' },
      { label: '$0.07', payout: 0.07, color: '#1a1a2e' },
      { label: '$5',    payout: 5.00, color: '#ffd700' },
      { label: '$0.03', payout: 0.03, color: '#2d2d44' },
      { label: '$0.25', payout: 0.25, color: '#1a1a2e' },
      { label: '$0.05', payout: 0.05, color: '#2d2d44' },
      { label: '$1',    payout: 1.00, color: '#1a1a2e' },
      { label: '$0.01', payout: 0.01, color: '#2d2d44' },
      { label: '$10',   payout: 10.00, color: '#ff6b9d' }
    ];

    var TOTAL = SECTORS.length;
    var SEG_ANGLE = 360 / TOTAL;
    var rotation = 0;
    var isSpinning = false;
    var COOLDOWN = 24 * 60 * 60 * 1000;
    var LAST_SPIN_KEY = 'daily_bonus_spin_' + uid;

    function setupCanvas() {
      var size = canvas.offsetWidth * 2;
      if (size < 100) size = 600;
      canvas.width = size;
      canvas.height = size;
      drawWheel();
    }

    function drawWheel() {
      var cx = canvas.width / 2;
      var cy = canvas.height / 2;
      var r = canvas.width / 2 - 6;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (var i = 0; i < TOTAL; i++) {
        var seg = SECTORS[i];
        var sa = (i * SEG_ANGLE - 90 + rotation) * Math.PI / 180;
        var ea = ((i + 1) * SEG_ANGLE - 90 + rotation) * Math.PI / 180;
        ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, r, sa, ea); ctx.closePath();
        ctx.fillStyle = seg.color; ctx.fill();
        ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + r * Math.cos(sa), cy + r * Math.sin(sa));
        ctx.strokeStyle = 'rgba(255,255,255,0.15)'; ctx.lineWidth = 1; ctx.stroke();
        ctx.save(); ctx.translate(cx, cy); ctx.rotate((sa + ea) / 2);
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillStyle = (seg.payout >= 5) ? '#000' : '#fff';
        ctx.font = 'bold ' + Math.round(r * 0.1) + 'px Arial';
        ctx.shadowColor = 'rgba(0,0,0,0.8)'; ctx.shadowBlur = 3;
        ctx.fillText(seg.label, r * 0.65, 0);
        ctx.restore();
      }
      ctx.beginPath(); ctx.arc(cx, cy, r * 0.1, 0, Math.PI * 2);
      ctx.fillStyle = '#ffd700'; ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
    }

    setupCanvas();
    window.addEventListener('resize', setupCanvas);

    function getLastSpin() { var v = localStorage.getItem(LAST_SPIN_KEY); return v ? parseInt(v) : 0; }
    function setLastSpin() { localStorage.setItem(LAST_SPIN_KEY, String(Date.now())); }
    function getRemaining() { var last = getLastSpin(); return last ? Math.max(0, COOLDOWN - (Date.now() - last)) : 0; }
    function fmtTime(ms) { var s = Math.floor(ms/1000); var h = Math.floor(s/3600); var m = Math.floor((s%3600)/60); var sec = s%60; return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0'); }

    function updateStatus() {
      var rem = getRemaining();
      if (rem > 0) {
        isSpinning = true; spinBtn.disabled = true; spinBtn.textContent = '⏳ ПОДОЖДИТЕ';
        timerBlock.style.display = 'block';
        bonusStatus.textContent = 'Бонус уже получен!'; bonusStatus.className = 'bonus-status wait';
        timerVal.textContent = fmtTime(rem);
      } else {
        isSpinning = false; spinBtn.disabled = false; spinBtn.textContent = '🎰 КРУТИТЬ';
        timerBlock.style.display = 'none';
        bonusStatus.textContent = 'Нажмите кнопку чтобы крутить!'; bonusStatus.className = 'bonus-status';
      }
    }
    setInterval(updateStatus, 1000);
    updateStatus();

    // Sync cooldown with server on load
    fetch('/api/bonus/daily-spin-status?userId=' + encodeURIComponent(uid))
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (data.lastSpin) {
          localStorage.setItem(LAST_SPIN_KEY, String(data.lastSpin));
          updateStatus();
        }
      }).catch(function(){});

    spinBtn.addEventListener('click', function() {
      if (isSpinning) return;
      if (getRemaining() > 0) return;
      isSpinning = true; spinBtn.disabled = true; spinBtn.textContent = '🎡 КРУТИТСЯ...';
      bonusStatus.textContent = 'Колесо крутится...'; bonusStatus.className = 'bonus-status';

      var weights = SECTORS.map(function(s){
        if (s.payout >= 10) return 1;
        if (s.payout >= 5)  return 2;
        if (s.payout >= 1)  return 5;
        if (s.payout >= 0.5) return 10;
        if (s.payout >= 0.25) return 18;
        if (s.payout >= 0.10) return 25;
        return 35;
      });
      var totalW = 0;
      for (var w = 0; w < weights.length; w++) totalW += weights[w];
      var rand = Math.random() * totalW;
      var chosenIdx = 0;
      for (var i = 0; i < weights.length; i++) { rand -= weights[i]; if (rand <= 0) { chosenIdx = i; break; } }

      var seg = SEG_ANGLE;
      var randomOffset = Math.random() * (seg - 2) + 1;
      var targetMod = ((-chosenIdx * seg - randomOffset) % 360 + 360) % 360;
      var currentMod = ((rotation % 360) + 360) % 360;
      var diff = currentMod - targetMod;
      var targetRot = rotation - 360 * 6 - diff;
      var startRot = rotation, t0 = performance.now(), dur = 5000;

      function tick(now) {
        var p = Math.min((now - t0) / dur, 1);
        var ease = 1 - Math.pow(1 - p, 3);
        rotation = startRot + (targetRot - startRot) * ease;
        drawWheel();
        if (p < 1) { requestAnimationFrame(tick); }
        else {
          rotation = targetRot;
          drawWheel();
          finish(chosenIdx);
        }
      }
      requestAnimationFrame(tick);
    });

    function finish(idx) {
      var sector = SECTORS[idx];
      setLastSpin();
      spinBtn.disabled = true; spinBtn.textContent = '⏳ ПОДОЖДИТЕ...';
      bonusStatus.textContent = 'Начисляем выигрыш...'; bonusStatus.className = 'bonus-status';

      fetch('/api/bonus/daily-spin', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({userId: uid})
      })
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (data.ok) {
          if (window.Balance) Balance.set(data.balance);
          bonusStatus.textContent = '🎉 Вы выиграли ' + data.label + '!';
          bonusStatus.className = 'bonus-status win';
        } else if (data.error === 'cooldown') {
          bonusStatus.textContent = '⏳ Бонус уже получен!';
          bonusStatus.className = 'bonus-status wait';
        } else {
          bonusStatus.textContent = '❌ Ошибка: ' + (data.error || 'неизвестная');
          bonusStatus.className = 'bonus-status';
          spinBtn.disabled = false; spinBtn.textContent = '🎰 КРУТИТЬ';
        }
        updateStatus();
      })
      .catch(function() {
        bonusStatus.textContent = '❌ Ошибка соединения';
        bonusStatus.className = 'bonus-status';
        spinBtn.disabled = false; spinBtn.textContent = '🎰 КРУТИТЬ';
        updateStatus();
      });
    }

    // Profile photo
    try {
      var tg2 = window.Telegram && window.Telegram.WebApp;
      if (tg2 && tg2.initDataUnsafe && tg2.initDataUnsafe.user) {
        var u = tg2.initDataUnsafe.user;
        var pImg = document.getElementById('profileImg');
        if (pImg) {
          if (u.photo_url) { pImg.src = u.photo_url; pImg.style.display = ''; }
          else if (u.id) { pImg.src = '/api/tg-photo/' + u.id; pImg.style.display = ''; }
        }
      }
    } catch(e) {}

  })();
  </script>
   <script src="js/wallet-modal.js"></script>
  <script src="js/profile-dropdown.js"></script>
<script src="js/footer.js"></script>
</body>
</html>
