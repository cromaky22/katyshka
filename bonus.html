<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Бонус — KATYSHKA</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .bonus-section{padding:20px;padding-bottom:100px;max-width:480px;margin:0 auto;text-align:center}
    .bonus-title{font-size:24px;font-weight:900;margin-bottom:8px}
    .bonus-sub{font-size:13px;color:var(--muted);margin-bottom:20px}
    
    /* Subscribe section */
    .subscribe-box{background:linear-gradient(135deg,rgba(21,97,255,0.1),rgba(46,227,107,0.05));border-radius:14px;padding:12px;margin-bottom:16px;border:1px solid rgba(255,255,255,0.06)}
    .subscribe-title{font-size:13px;font-weight:700;margin-bottom:10px;color:var(--text)}
    .subscribe-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:12px;border-radius:10px;border:none;font-size:14px;font-weight:700;cursor:pointer;background:linear-gradient(135deg,#1559ff,#2ee36b);color:#fff;text-decoration:none;transition:all 0.2s}
    .subscribe-btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(21,97,255,0.3)}
    .subscribe-btn img{width:20px;height:20px;border-radius:50%}
    .subscribe-claim{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:12px;border-radius:10px;border:none;font-size:14px;font-weight:700;cursor:pointer;background:linear-gradient(135deg,#ffd700,#ff6b9d);color:#000;margin-top:8px;transition:all 0.2s}
    .subscribe-claim:hover{transform:translateY(-2px)}
    .subscribe-status{margin-top:8px;padding:8px;border-radius:8px;font-size:12px;font-weight:600;display:none}
    .subscribe-status.show{display:block}
    
    /* Wheel */
    .wheel-container{position:relative;width:100%;max-width:280px;margin:0 auto 16px}
    .wheel-canvas{width:100%;aspect-ratio:1;border-radius:50%;box-shadow:0 0 0 6px rgba(255,255,255,0.08),0 0 40px rgba(107,47,160,0.4);background:#0a0118}
    .wheel-pointer{position:absolute;top:6px;left:50%;transform:translateX(-50%) rotate(180deg);font-size:24px;color:#ffd700;z-index:10;filter:drop-shadow(0 4px 8px rgba(0,0,0,0.6))}
    
    .bonus-title{font-size:20px;font-weight:900;margin-bottom:6px}
    .bonus-sub{font-size:12px;color:var(--muted);margin-bottom:12px}
    .bonus-status{padding:10px;border-radius:10px;font-weight:600;font-size:13px;background:rgba(10,10,30,0.8);margin-bottom:12px;border:1px solid rgba(255,255,255,0.1)}
    .bonus-status.win{background:rgba(76,175,80,0.2);color:#4caf50;border-color:rgba(76,175,80,0.4)}
    .bonus-status.wait{background:rgba(255,193,7,0.2);color:#ffc107;border-color:rgba(255,193,7,0.4)}
    
    .bonus-btn{width:100%;padding:14px;border-radius:12px;border:none;font-size:16px;font-weight:800;cursor:pointer;background:linear-gradient(135deg,#ff6b9d,#ffd700);color:#000;text-transform:uppercase;letter-spacing:1px;transition:all 0.2s;box-shadow:0 8px 24px rgba(255,107,157,0.3)}
    .bonus-btn:hover{transform:translateY(-3px);box-shadow:0 12px 32px rgba(255,107,157,0.4)}
    .bonus-btn:disabled{opacity:0.4;cursor:not-allowed;transform:none;box-shadow:none}
    
    .timer-big{font-size:32px;font-weight:900;color:#ffd700;margin:8px 0 2px}
    .timer-label{font-size:11px;color:var(--muted)}
    
    /* Adaptive */
    @media(max-width:480px){
      .bonus-section{padding:12px;padding-bottom:90px}
      .bonus-title{font-size:18px}
      .subscribe-box{padding:10px}
      .subscribe-title{font-size:12px}
      .subscribe-btn,.subscribe-claim{padding:10px;font-size:13px}
      .wheel-container{max-width:240px}
      .bonus-btn{padding:12px;font-size:14px}
      .timer-big{font-size:28px}
    }
    
    @media(max-width:360px){
      .bonus-section{padding:10px;padding-bottom:80px}
      .bonus-title{font-size:16px}
      .subscribe-box{padding:8px}
      .subscribe-btn,.subscribe-claim{padding:8px;font-size:12px}
      .wheel-container{max-width:200px}
      .bonus-btn{padding:10px;font-size:13px}
      .timer-big{font-size:24px}
    }
    
    @media(max-width:360px){
      .bonus-section{padding:10px}
      .bonus-title{font-size:18px}
      .subscribe-box{padding:10px}
      .subscribe-btn,.subscribe-claim{padding:10px;font-size:13px}
      .wheel-container{max-width:240px}
      .bonus-btn{padding:12px;font-size:14px}
      .timer-big{font-size:28px}
    }
  </style>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <header class="app-header">
    <div class="left-controls" style="width:32px"></div>
    <div class="header-title">BONUS</div>
    <div class="right-controls">
      <div class="balance-pill"><span class="balance-value" id="hbal">0.00</span><span class="currency">$</span></div>
      <button class="profile" id="profileBtn" title="Профиль" aria-label="Профиль"><img class="profile-icon" id="profileImg" src="" alt="Аватар" onerror="this.style.display='none'"></button>
    </div>
  </header>

  <main class="bonus-section">
    <!-- Subscribe reward - TOP -->
    <div class="subscribe-box">
      <div class="subscribe-title">💎 Подпишись на канал и получи $0.3!</div>
      <a href="https://t.me/milfacasino" target="_blank" class="subscribe-btn" id="subscribeBtn">
        <img src="assets/telega.jpg" alt="Telegram"> ПОДПИСАТЬСЯ
      </a>
      <button class="subscribe-claim" id="claimSubBtn" style="display:none">🎁 ЗАБРАТЬ $0.3</button>
      <div class="subscribe-status" id="subStatus"></div>
    </div>

    <!-- Wheel - BOTTOM -->
    <div class="bonus-title">🎡 Колесо Удачи</div>
    <div class="bonus-sub">Крути раз в день и выигрывай до $10!</div>

    <div class="wheel-container">
      <canvas id="bonusWheel" class="wheel-canvas"></canvas>
      <div class="wheel-pointer">▼</div>
    </div>

    <div class="bonus-status" id="bonusStatus">Загрузка...</div>

    <div id="timerBlock" style="display:none">
      <div class="timer-big" id="timerVal">00:00:00</div>
      <div class="timer-label">до следующего бонуса</div>
    </div>

    <button class="bonus-btn" id="spinBtn">🎰 КРУТИТЬ</button>
  </main>

  <nav class="bottom-nav">
    <a href="home.html#games" class="nav-item" data-name="games"><span class="icon">🎮</span><span class="label">Games</span></a>
    <a href="wallet.html" class="nav-item" data-name="wallet"><span class="icon">💼</span><span class="label">Wallet</span></a>
    <a href="home.html" class="nav-item center" data-name=""><span class="icon">💎</span></a>
    <a href="bonus.html" class="nav-item active" data-name="bonus"><span class="icon">🎁</span><span class="label">Bonus</span></a>
    <a href="menu.html" class="nav-item" data-name="menu"><span class="icon">☰</span><span class="label">Menu</span></a>
  </nav>

  <script src="js/app.js"></script>
  <script src="js/balance.js"></script>
  <script>
  (function(){
    var uid = 'u' + Math.random().toString(36).substr(2, 9);
    try {
      var tg = window.Telegram && window.Telegram.WebApp;
      if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
        uid = String(tg.initDataUnsafe.user.id);
        localStorage.setItem('tg_uid', uid);
      }
    } catch(e) {}
    var savedUid = localStorage.getItem('tg_uid');
    if (savedUid) uid = savedUid;

    var canvas = document.getElementById('bonusWheel');
    var ctx = canvas.getContext('2d');
    var spinBtn = document.getElementById('spinBtn');
    var bonusStatus = document.getElementById('bonusStatus');
    var timerBlock = document.getElementById('timerBlock');
    var timerVal = document.getElementById('timerVal');

    var SECTORS = [
      { label: '$0.01', payout: 0.01, color: '#1a1a2e' },
      { label: '$0.10', payout: 0.10, color: '#2d2d44' },
      { label: '$0.50', payout: 0.50, color: '#1a1a2e' },
      { label: '$0.02', payout: 0.02, color: '#2d2d44' },
      { label: '$0.07', payout: 0.07, color: '#1a1a2e' },
      { label: '$5',    payout: 5.00, color: '#ffd700' },
      { label: '$0.03', payout: 0.03, color: '#2d2d44' },
      { label: '$0.25', payout: 0.25, color: '#1a1a2e' },
      { label: '$0.05', payout: 0.05, color: '#2d2d44' },
      { label: '$1',    payout: 1.00, color: '#1a1a2e' },
      { label: '$0.01', payout: 0.01, color: '#2d2d44' },
      { label: '$10',   payout: 10.00, color: '#ff6b9d' }
    ];

    var TOTAL = SECTORS.length;
    var SEG_ANGLE = 360 / TOTAL;
    var rotation = 0;
    var isSpinning = false;
    var COOLDOWN = 24 * 60 * 60 * 1000;
    var LAST_SPIN_KEY = 'daily_bonus_spin_' + uid;

    function setupCanvas() {
      var size = canvas.offsetWidth * 2;
      if (size < 100) size = 680;
      canvas.width = size;
      canvas.height = size;
      drawWheel();
    }

    function drawWheel() {
      var cx = canvas.width / 2;
      var cy = canvas.height / 2;
      var r = canvas.width / 2 - 6;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (var i = 0; i < TOTAL; i++) {
        var seg = SECTORS[i];
        var sa = (i * SEG_ANGLE - 90 + rotation) * Math.PI / 180;
        var ea = ((i + 1) * SEG_ANGLE - 90 + rotation) * Math.PI / 180;
        ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, r, sa, ea); ctx.closePath();
        ctx.fillStyle = seg.color; ctx.fill();
        ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + r * Math.cos(sa), cy + r * Math.sin(sa));
        ctx.strokeStyle = 'rgba(255,255,255,0.2)'; ctx.lineWidth = 1; ctx.stroke();
        ctx.save(); ctx.translate(cx, cy); ctx.rotate((sa + ea) / 2);
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillStyle = (seg.payout >= 5) ? '#000' : '#fff';
        ctx.font = 'bold ' + Math.round(r * 0.1) + 'px Arial';
        ctx.shadowColor = 'rgba(0,0,0,0.8)'; ctx.shadowBlur = 3;
        ctx.fillText(seg.label, r * 0.65, 0);
        ctx.restore();
      }
      ctx.beginPath(); ctx.arc(cx, cy, r * 0.1, 0, Math.PI * 2);
      ctx.fillStyle = '#ffd700'; ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
    }

    setupCanvas();
    window.addEventListener('resize', setupCanvas);

    function getLastSpin() { var v = localStorage.getItem(LAST_SPIN_KEY); return v ? parseInt(v) : 0; }
    function setLastSpin() { localStorage.setItem(LAST_SPIN_KEY, String(Date.now())); }
    function getRemaining() { var last = getLastSpin(); return last ? Math.max(0, COOLDOWN - (Date.now() - last)) : 0; }
    function fmtTime(ms) { var s = Math.floor(ms/1000); var h = Math.floor(s/3600); var m = Math.floor((s%3600)/60); var sec = s%60; return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0'); }

    function updateStatus() {
      var rem = getRemaining();
      if (rem > 0) {
        isSpinning = true; spinBtn.disabled = true; spinBtn.textContent = '⏳ ПОДОЖДИТЕ';
        timerBlock.style.display = 'block';
        bonusStatus.textContent = 'Бонус уже получен!'; bonusStatus.className = 'bonus-status wait';
        timerVal.textContent = fmtTime(rem);
      } else {
        isSpinning = false; spinBtn.disabled = false; spinBtn.textContent = '🎰 КРУТИТЬ';
        timerBlock.style.display = 'none';
        bonusStatus.textContent = 'Нажмите кнопку чтобы крутить!'; bonusStatus.className = 'bonus-status';
      }
    }
    setInterval(updateStatus, 1000);
    updateStatus();

    spinBtn.addEventListener('click', function() {
      if (isSpinning) return;
      if (getRemaining() > 0) return;
      isSpinning = true; spinBtn.disabled = true; spinBtn.textContent = '🎡 КРУТИТСЯ...';
      bonusStatus.textContent = 'Колесо крутится...'; bonusStatus.className = 'bonus-status';
      var weights = SECTORS.map(function(s){ if(s.payout>=10)return 1; if(s.payout>=5)return 2; if(s.payout>=1)return 3; if(s.payout>=0.5)return 5; if(s.payout>=0.25)return 8; if(s.payout>=0.10)return 15; return 25; });
      var totalW = weights.reduce(function(a,b){return a+b;},0);
      var rand = Math.random() * totalW;
      var chosenIdx = 0;
      for(var i=0;i<weights.length;i++){ rand-=weights[i]; if(rand<=0){chosenIdx=i;break;} }
      var targetAngle = 360-(chosenIdx*SEG_ANGLE+SEG_ANGLE/2);
      var curNorm = (((-rotation)%360)+360)%360;
      var diff = targetAngle-curNorm; while(diff<0) diff+=360;
      var totalRot = 360*6+diff;
      var startRot = rotation, t0 = performance.now(), dur = 5000;
      function tick(now) {
        var p = Math.min((now-t0)/dur,1);
        var ease = 1-Math.pow(1-p,4);
        rotation = startRot-totalRot*ease;
        drawWheel();
        if(p<1){requestAnimationFrame(tick);}
        else{rotation=startRot-totalRot;drawWheel();finish(chosenIdx);}
      }
      requestAnimationFrame(tick);
    });

    function finish(idx) {
      var sector = SECTORS[idx]; setLastSpin();
      var newBal = Math.round((Balance.get()+sector.payout)*100)/100;
      Balance.set(newBal);
      bonusStatus.textContent = '🎉 Вы выиграли '+sector.label+'!';
      bonusStatus.className = 'bonus-status win';
      updateStatus();
    }

    // Photo
    try{
      var tg=window.Telegram&&window.Telegram.WebApp;
      if(tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user){
        var u=tg.initDataUnsafe.user;
        var pImg=document.getElementById('profileImg');
        if(pImg){
          if(u.photo_url){pImg.src=u.photo_url;pImg.style.display='';}
          else if(u.id){pImg.src='/api/tg-photo/'+u.id;pImg.style.display='';}
        }
      }
    }catch(e){}

    // Subscribe
    var SUB_REWARD = 0.3;
    var subBtn = document.getElementById('subscribeBtn');
    var claimSubBtn = document.getElementById('claimSubBtn');
    var subStatus = document.getElementById('subStatus');

    function checkSubStatus(){
      if(localStorage.getItem('sub_claimed_'+uid)){
        claimSubBtn.style.display='none'; subBtn.style.display='none';
        subStatus.style.display='block'; subStatus.textContent='✅ Награда уже получена!';
        subStatus.className='subscribe-status win';
      }
    }

    claimSubBtn.addEventListener('click',function(){
      fetch('/api/bonus/subscribe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userId:uid})})
      .then(function(r){return r.json();})
      .then(function(data){
        if(data.ok){
          localStorage.setItem('sub_claimed_'+uid,'1');
          Balance.set(Math.round((Balance.get()+SUB_REWARD)*100)/100);
          claimSubBtn.style.display='none';subBtn.style.display='none';
          subStatus.style.display='block';subStatus.textContent='🎉 Вы получили $0.3!';
          subStatus.className='subscribe-status win';
        }else if(data.error==='already_claimed'){
          localStorage.setItem('sub_claimed_'+uid,'1');checkSubStatus();
        }else{
          subStatus.style.display='block';subStatus.textContent='❌ '+(data.error||'Ошибка');
          subStatus.className='subscribe-status';
        }
      }).catch(function(){
        subStatus.style.display='block';subStatus.textContent='❌ Ошибка соединения';
        subStatus.className='subscribe-status';
      });
    });

    checkSubStatus();
  })();
  </script>
</body>
</html>
