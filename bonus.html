<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mini Casino — Bonus</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .bonus-section{padding:20px;max-width:480px;margin:0 auto}
    .bonus-card{background:var(--card);border-radius:16px;padding:20px;margin-bottom:16px;text-align:center}
    .bonus-icon{font-size:48px;margin-bottom:12px}
    .bonus-title{font-size:18px;font-weight:700;margin-bottom:8px}
    .bonus-desc{font-size:13px;color:var(--muted);margin-bottom:16px}
    .bonus-btn{background:linear-gradient(135deg,#4caf50,#2e7d32);border:none;padding:14px 32px;border-radius:12px;color:#fff;font-size:16px;font-weight:700;cursor:pointer;transition:all 0.2s;width:100%}
    .bonus-btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(76,175,80,0.3)}
    .bonus-btn:disabled{opacity:0.5;cursor:not-allowed;transform:none;box-shadow:none}
    .bonus-timer{font-size:12px;color:var(--muted);margin-top:12px}
    .bonus-success{font-size:14px;color:var(--accent-green);margin-top:12px;font-weight:600}
  </style>
</head>
<body>
  <header class="app-header">
    <div class="left-controls">
      <button class="btn-icon" aria-label="back">❀</button>
      <img src="assets/logo.png" alt="Logo" class="logo-small" onerror="this.style.display='none'">
    </div>
    <div class="header-title">BONUS</div>
    <div class="right-controls" style="position:relative">
      <div class="balance-pill">
        <span class="wallet-icon">💠</span>
        <span class="balance-value">0.00</span>
        <span class="currency">$</span>
        <span class="caret">▾</span>
      </div>
      <button class="profile" id="profileBtn" title="Профиль" aria-label="Профиль"><img class="profile-icon" src="" alt="Аватар" onerror="this.style.display='none'"></button>
      <div class="profile-dropdown" id="profileDropdown">
        <div class="pd-header">
          <div class="pd-id-label">ID игрока</div>
          <div class="pd-id-value">
            <span id="pdUserId">—</span>
            <span class="copy-id" id="copyIdBtn" title="Копировать ID">📋</span>
          </div>
        </div>
        <div class="pd-body">
          <a href="profile.html" class="pd-btn"><span class="pd-btn-icon">👤</span>Профиль<span class="pd-btn-arrow">→</span></a>
          <button class="pd-btn" id="pdPromoBtn"><span class="pd-btn-icon">🎟</span>Промокод<span class="pd-btn-arrow">→</span></button>
        </div>
      </div>
      <div class="pd-overlay" id="pdOverlay"></div>
    </div>
  </header>
  <main class="content">
    <div class="bonus-section">
      <div class="bonus-card">
        <div class="bonus-icon">🎁</div>
        <div class="bonus-title">Часовой бонус</div>
        <div class="bonus-desc">Получай $100 каждый час!</div>
        <button class="bonus-btn" id="hourlyBonusBtn">Получить $100</button>
        <div class="bonus-timer" id="bonusTimer"></div>
        <div class="bonus-success" id="bonusSuccess"></div>
      </div>
    </div>
  </main>
  <nav class="bottom-nav">
    <a href="home.html#games" class="nav-item" data-name="games"><span class="icon">🎮</span><span class="label">Games</span></a>
    <a href="wallet.html" class="nav-item" data-name="wallet"><span class="icon">💼</span><span class="label">Wallet</span></a>
    <a href="home.html" class="nav-item center" data-name=""><span class="icon">💎</span></a>
    <a href="bonus.html" class="nav-item" data-name="bonus"><span class="icon">🎁</span><span class="label">Bonus</span></a>
    <a href="menu.html" class="nav-item" data-name="menu"><span class="icon">☰</span><span class="label">Menu</span></a>
  </nav>
  <script src="js/app.js"></script>
  <script>
  (function(){
    const btn = document.getElementById('hourlyBonusBtn');
    const timer = document.getElementById('bonusTimer');
    const success = document.getElementById('bonusSuccess');
    const COOLDOWN = 3600000; // 1 hour in ms

    function updateUI(){
      const lastClaim = localStorage.getItem('mc_hourly_bonus');
      if(lastClaim){
        const elapsed = Date.now() - parseInt(lastClaim);
        if(elapsed < COOLDOWN){
          btn.disabled = true;
          const remaining = COOLDOWN - elapsed;
          const mins = Math.floor(remaining / 60000);
          const secs = Math.floor((remaining % 60000) / 1000);
          timer.textContent = 'Следующий бонус через ' + mins + 'м ' + secs + 'с';
          return;
        }
      }
      btn.disabled = false;
      timer.textContent = 'Бонус доступен!';
    }

    btn.addEventListener('click', ()=>{
      const lastClaim = localStorage.getItem('mc_hourly_bonus');
      if(lastClaim && (Date.now() - parseInt(lastClaim)) < COOLDOWN) return;

      localStorage.setItem('mc_hourly_bonus', Date.now().toString());
      const balance = parseFloat(localStorage.getItem('mc_balance') || '0') || 0;
      const newBalance = Math.round((balance + 100) * 100) / 100;
      localStorage.setItem('mc_balance', newBalance.toFixed(2));
      document.querySelectorAll('.balance-value').forEach(el => el.textContent = newBalance.toFixed(2));
      success.textContent = '✅ Получено +$100!';
      updateUI();
    });

    updateUI();
    setInterval(updateUI, 1000);
  })();
  </script>
</body>
</html>
