<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
    <defs>
        <style>
            .cls-1{fill:#2196f3;stroke:#1a1a1a;stroke-width:1;}
            .cls-2{fill:#ffc107;stroke:#1a1a1a;stroke-width:1;}
            .cls-3{fill:#ff5722;stroke:#1a1a1a;stroke-width:1;}
            .cls-4{fill:#8bc34a;stroke:#1a1a1a;stroke-width:1;}
        </style>
    </defs>
    <!-- x2 Blue (0° - 90°) Top Right -->
    <path class="cls-1" d="M 100 100 L 100 5 A 95 95 0 0 1 195 100 Z"/>
    
    <!-- x3 Yellow (90° - 180°) Bottom Right -->
    <path class="cls-2" d="M 100 100 L 195 100 A 95 95 0 0 1 100 195 Z"/>
    
    <!-- x5 Orange (180° - 270°) Bottom Left -->
    <path class="cls-3" d="M 100 100 L 100 195 A 95 95 0 0 1 5 100 Z"/>
    
    <!-- x50 Green (270° - 360°) Top Left -->
    <path class="cls-4" d="M 100 100 L 5 100 A 95 95 0 0 1 100 5 Z"/>
    
    <!-- Разделители между сегментами -->
    <line x1="100" y1="100" x2="100" y2="5" stroke="#1a1a1a" stroke-width="2"/>
    <line x1="100" y1="100" x2="195" y2="100" stroke="#1a1a1a" stroke-width="2"/>
    <line x1="100" y1="100" x2="100" y2="195" stroke="#1a1a1a" stroke-width="2"/>
    <line x1="100" y1="100" x2="5" y2="100" stroke="#1a1a1a" stroke-width="2"/>
    
    <!-- Центральная точка -->
    <circle cx="100" cy="100" r="10" fill="#1a1a1a"/>
</svg>