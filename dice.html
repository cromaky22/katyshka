<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dice</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dice.css">

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<body class="page-dice">
  <!-- Cosmic background -->
  <div class="cosmic-bg">
    <div class="nebula n1"></div>
    <div class="nebula n2"></div>
    <div class="nebula n3"></div>
    <div class="nebula n4"></div>
    <div class="nebula n5"></div>
    <div class="stars-layer">
      <div class="star s1"></div>
      <div class="star s2"></div>
      <div class="star s3"></div>
      <div class="star s4"></div>
      <div class="star s5"></div>
      <div class="star s6"></div>
      <div class="star s7"></div>
      <div class="star s8"></div>
      <div class="star s9"></div>
      <div class="star s10"></div>
      <div class="star s11"></div>
      <div class="star s12"></div>
      <div class="star s13"></div>
      <div class="star s14"></div>
      <div class="star s15"></div>
    </div>
  </div>

  <header class="app-header">
    <div class="left-controls"></div>
    <div class="header-title" style="margin-right:0">DICE</div>
    <div class="right-controls" style="position:relative">
      <div class="balance-pill" id="balTrigger" style="cursor:pointer">
        <span class="wallet-icon">👛</span>
        <span class="balance-value" id="hbal">0.00</span>
        <span class="currency">$</span>
        <span class="caret">▾</span>
      </div>
      <button class="profile" id="profileBtn" title="Профиль" aria-label="Профиль"><img class="profile-icon" src="" alt="Аватар" onerror="this.style.display='none'"></button>
      <div class="profile-dropdown" id="profileDropdown">
        <div class="pd-header">
          <div class="pd-id-label">ID игрока</div>
          <div class="pd-id-value">
            <span id="pdUserId">—</span>
          </div>
        </div>
        <div class="pd-body">
          <a href="profile.html" class="pd-btn"><span class="pd-btn-icon">👤</span>Профиль<span class="pd-btn-arrow">→</span></a>
          <button class="pd-btn" id="pdPromoBtn"><span class="pd-btn-icon">🎟</span>Промокод<span class="pd-btn-arrow">→</span></button>
        </div>
      </div>
      <div class="pd-overlay" id="pdOverlay"></div>
    </div>
  </header>

  <main class="dice-game">
    <div class="dice-board">

      <div class="dice-mode-selector">
        <button class="mode-btn active" data-mode="1dice">1 кубик</button>
        <button class="mode-btn" data-mode="2dice">2 кубика</button>
        <button class="mode-btn" data-mode="3dice">3 кубика</button>
      </div>

      <div class="history-section">
        <div class="history-label">История игр</div>
        <div class="history-scroll" id="historyScroll"></div>
      </div>

      <div class="dice-display" id="diceDisplay">
        <div class="dice-timer-overlay">
          <span class="timer-value" id="timerValue">-</span>
        </div>
        <div class="dice-container" id="diceContainer">
          <div class="dice-wrapper" id="diceWrap1">
            <div class="dice" id="dice1"></div>
          </div>
          <div class="dice-wrapper" id="diceWrap2">
            <div class="dice" id="dice2"></div>
          </div>
          <div class="dice-wrapper" id="diceWrap3">
            <div class="dice" id="dice3"></div>
          </div>
        </div>
        <div class="dice-result" id="diceResult"></div>
      </div>

      <div class="game-status" id="gameStatus">Подключение...</div>

      <div class="betting-section">
        <div class="section-title">Стол ставок</div>
        <div class="betting-grid" id="bettingGrid"></div>
      </div>

      <div class="active-bets" id="activeBets" style="display:none">
        <div class="section-title">Ваши ставки</div>
        <div class="active-bets-list" id="activeBetsList"></div>
      </div>

      <div class="win-announcement" id="winAnnounce" style="display:none">
        <div class="win-title" id="winTitle">🎉 Результат</div>
        <div class="win-details" id="winDetails"></div>
      </div>

      <div class="all-players-bets" id="allPlayersBets" style="display:none">
        <div class="section-title">Ставки игроков</div>
        <div class="all-bets-list" id="allPlayersBetsList"></div>
      </div>

      <div class="stake-panel">
        <div class="stake-header">
          <label>Ставка</label>
          <span class="stake-range">От $0.10 до $200</span>
        </div>
        <div class="quick-bet-buttons">
          <button class="quick-bet-btn" data-amount="0.1"><span class="dollar">$</span>+0.1</button>
          <button class="quick-bet-btn" data-amount="1"><span class="dollar">$</span>+1</button>
          <button class="quick-bet-btn" data-amount="5"><span class="dollar">$</span>+5</button>
          <button class="quick-bet-btn" data-amount="10"><span class="dollar">$</span>+10</button>
        </div>
        <div class="stake-input-group">
          <input type="number" id="stakeInput" value="0.1" min="0.1" max="200" step="0.1">
          <div class="stake-controls">
            <button class="stake-btn" id="halfBtn">½</button>
            <button class="stake-btn" id="doubleBtn">×2</button>
          </div>
        </div>
      </div>

      <div class="hash-display" id="hashDisplay" style="display:none">
        <span class="hash-label">Hash:</span>
        <span class="hash-value" id="hashValue"></span>
</div>
      </div>
    </section>
  </main>

  <nav class="bottom-nav">
    <a href="games.html" class="nav-item" data-name="games"><span class="icon">🎮</span><span class="label">Games</span></a>
    <a href="wallet.html" class="nav-item" data-name="wallet"><span class="icon">💼</span><span class="label">Wallet</span></a>
    <a href="home.html" class="nav-item center" data-name=""><span class="icon">💎</span></a>
    <a href="bonus.html" class="nav-item" data-name="bonus"><span class="icon">🎁</span><span class="label">Bonus</span></a>
    <a href="menu.html" class="nav-item" data-name="menu"><span class="icon">☰</span><span class="label">Menu</span></a>
  </nav>

  <script src="/socket.io/socket.io.js"></script>
  <script src="js/balance.js"></script>
  <script src="js/wallet-modal.js"></script>
  <script src="js/profile-dropdown.js"></script>
  <script src="js/dice.js"></script>
  <script>
    function joinGame(){
      var socket = (window.Balance && Balance.getSocket) ? Balance.getSocket() : null;
      if(socket && socket.connected){
        socket.emit('join_game', 'dice');
        window.addEventListener('beforeunload', function(){ socket.emit('leave_game', 'dice'); });
      } else {
        setTimeout(joinGame, 500);
      }
    }
    setTimeout(joinGame, 1000);
  </script>
<script src="js/footer.js"></script>
</body>
</html>
