<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:linear-gradient(135deg,#0a0015,#15002a,#0a0015);min-height:100vh;color:#fff;font-family:Arial,sans-serif}
.wrap{max-width:960px;margin:0 auto;padding:10px 12px 80px}
.header{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:rgba(255,255,255,0.05);border-radius:12px;margin-bottom:12px}
.back{color:#fff;text-decoration:none;font-size:22px;padding:4px 10px;border-radius:8px;background:rgba(255,255,255,0.1)}
.title{font-size:18px;font-weight:800;background:linear-gradient(90deg,#ff6b9d,#ffd700);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.bal{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:700;background:rgba(0,0,0,0.3);padding:6px 12px;border-radius:20px}
.bal-val{color:#ffd700}
.search-box{width:100%;padding:10px 14px;border-radius:10px;border:1px solid rgba(255,255,255,0.12);background:rgba(0,0,0,0.3);color:#fff;font-size:14px;margin-bottom:12px;outline:none}
.search-box:focus{border-color:#ff6b9d}
.filter-row{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.filter-btn{padding:6px 14px;border-radius:20px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.05);color:rgba(255,255,255,0.7);cursor:pointer;font-size:12px;font-weight:600;transition:all 0.15s}
.filter-btn.active,.filter-btn:hover{background:rgba(255,107,157,0.2);border-color:#ff6b9d;color:#fff}
.games-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.game-card{background:rgba(255,255,255,0.04);border-radius:12px;overflow:hidden;cursor:pointer;transition:all 0.2s;border:1px solid rgba(255,255,255,0.06)}
.game-card:hover{transform:translateY(-4px);border-color:#ff6b9d;box-shadow:0 10px 30px rgba(255,107,157,0.15)}
.game-thumb{width:100%;height:110px;object-fit:cover;background:linear-gradient(135deg,#2a1550,#1a0d35)}
.game-info{padding:8px 10px}
.game-name{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.game-meta{display:flex;justify-content:space-between;align-items:center;margin-top:4px}
.game-provider{font-size:10px;color:rgba(255,255,255,0.4)}
.game-rtp{font-size:10px;color:#4caf50;font-weight:600}
/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.95);z-index:100;display:none;align-items:center;justify-content:center;padding:10px}
.modal-overlay.show{display:flex}
.modal-box{width:100%;max-width:850px;background:#111;border-radius:16px;overflow:hidden;position:relative}
.modal-top{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:rgba(255,255,255,0.05)}
.modal-title{font-size:14px;font-weight:700}
.modal-close{background:rgba(255,0,0,0.3);border:none;color:#fff;font-size:18px;padding:4px 10px;border-radius:6px;cursor:pointer}
.modal-close:hover{background:rgba(255,0,0,0.6)}
.modal-frame{width:100%;height:75vh;border:none;background:#000}
</style>
</head>

<div class="wrap">

  </div>
  <input class="search-box" id="searchBox" placeholder="🔍 Поиск слота...">
  <div class="filter-row">
    <button class="filter-btn active" data-filter="all">Все</button>
    <button class="filter-btn" data-filter="pragmatic-play">Pragmatic Play</button>

    <button class="filter-btn" data-filter="play-n-go">Play'n GO</button>
    <button class="filter-btn" data-filter="netent">NetEnt</button>
  </div>
  <div class="games-grid" id="gamesGrid"></div>
</div>

<div class="modal-overlay" id="modal">
  <div class="modal-box">
    <div class="modal-top">
      <span class="modal-title" id="modalTitle">Слот</span>
      <button class="modal-close" id="modalClose">✕</button>
    </div>
    <iframe class="modal-frame" id="gameFrame" src="" allowfullscreen></iframe>
  </div>
</div>

const grid=document.getElementById('gamesGrid');
const modal=document.getElementById('modal');
const frame=document.getElementById('gameFrame');
const modalTitle=document.getElementById('modalTitle');
const closeBtn=document.getElementById('modalClose');
const searchBox=document.getElementById('searchBox');
const filterBtns=document.querySelectorAll('.filter-btn');

let currentFilter='all';

function renderGames(){
  const q=searchBox.value.toLowerCase();
  grid.innerHTML='';
  GAMES.filter(g=>{
    const matchName=g.name.toLowerCase().includes(q);
    const matchProvider=currentFilter==='all'||g.provider===currentFilter;
    return matchName&&matchProvider;
  }).forEach(game=>{
    const card=document.createElement('div');
    card.className='game-card';
    card.innerHTML=`
      <div class="game-thumb">${game.icon}</div>
      <div class="game-info">
        <div class="game-name">${game.name}</div>
        <div class="game-meta">
          <span class="game-provider">${game.provider.replace(/-/g,' ')}</span>
          <span class="game-rtp">${game.rtp}</span>
        </div>
      </div>
    `;
    card.onclick=()=>{
      modalTitle.textContent=game.name;
      frame.src=game.url;
      modal.classList.add('show');
    };
    grid.appendChild(card);
  });
}

// Events
closeBtn.onclick=()=>{modal.classList.remove('show');frame.src=''};
modal.onclick=e=>{if(e.target===modal){modal.classList.remove('show');frame.src=''}};
searchBox.oninput=renderGames;
filterBtns.forEach(btn=>{
  btn.onclick=()=>{
    filterBtns.forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter=btn.dataset.filter;
    renderGames();
  };
});

// Balance
const bal=parseFloat(localStorage.getItem('mc_balance'))||100;
document.getElementById('bal').textContent=bal.toFixed(2);

renderGames();
