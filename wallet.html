<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Кошелёк — KATYSHKA</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .wallet-wrap{max-width:480px;margin:0 auto;padding:12px 12px 80px}
    .w-card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px}
    .w-tabs{display:flex;gap:4px;margin-bottom:16px}
    .w-tabs .tab{flex:1;padding:10px;border:none;border-radius:10px;background:rgba(255,255,255,0.06);color:var(--muted);cursor:pointer;font-size:10px;font-weight:700;text-align:center}
    .w-tabs .tab.active{background:linear-gradient(135deg,#ff6b9d,#ffd700);color:#000}
    .w-panel{display:none}
    .w-panel.active{display:block}
    .w-bal{text-align:center;padding:16px;background:rgba(0,0,0,0.2);border-radius:12px;margin-bottom:16px}
    .w-bal-label{font-size:11px;color:var(--muted)}
    .w-bal-val{font-size:32px;font-weight:900;color:#ffd700;margin-top:4px}
    .w-methods{display:flex;gap:8px;margin-bottom:12px}
    .w-method{flex:1;padding:14px 8px;border-radius:12px;border:2px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.03);cursor:pointer;text-align:center;transition:all 0.2s}
    .w-method.sel{border-color:#4caf50;background:rgba(76,175,80,0.12)}
    .w-method .ico{font-size:28px;display:block;margin-bottom:4px}
    .w-method .nm{font-size:11px;font-weight:600}
    .w-label{font-size:11px;color:var(--muted);margin-bottom:6px;display:block}
    .w-input{width:100%;padding:14px;border-radius:10px;border:1px solid rgba(255,255,255,0.1);background:rgba(0,0,0,0.2);color:#fff;font-size:18px;font-weight:700;outline:none;box-sizing:border-box}
    .w-input:focus{border-color:#ffd700}
    .w-quick{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px;margin-bottom:14px}
    .w-q{padding:8px;border-radius:8px;border:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.04);color:rgba(255,255,255,0.7);cursor:pointer;font-size:11px;font-weight:600;text-align:center}
    .w-q:hover{background:rgba(255,255,255,0.1)}
    .w-btn{width:100%;padding:16px;border-radius:12px;border:none;font-size:16px;font-weight:800;cursor:pointer;transition:all 0.2s;text-transform:uppercase;letter-spacing:0.5px;margin-top:8px}
    .w-btn:hover{transform:translateY(-2px)}
    .w-btn:disabled{opacity:0.4;cursor:not-allowed;transform:none}
    .w-dep-btn{background:linear-gradient(135deg,#4caf50,#2e7d32);color:#fff;box-shadow:0 8px 24px rgba(76,175,80,0.25)}
    .w-wd-btn{background:linear-gradient(135deg,#2196f3,#1565c0);color:#fff;box-shadow:0 8px 24px rgba(33,150,243,0.25)}
    .w-msg{padding:12px;border-radius:10px;text-align:center;font-weight:600;font-size:13px;margin-top:10px;display:none}
    .w-msg.show{display:block}
    .w-msg.ok{background:rgba(76,175,80,0.15);color:#4caf50}
    .w-msg.err{background:rgba(244,67,54,0.15);color:#f44336}
    .w-msg.info{background:rgba(33,150,243,0.15);color:#64b5f6}
    .w-receive{font-size:22px;font-weight:900;color:#4caf50;padding:12px;background:rgba(0,0,0,0.2);border-radius:10px;margin-top:8px;text-align:center}
    .w-wd-info{font-size:10px;color:var(--muted);margin-top:8px;line-height:1.4}
  </style>
</head>
<body>
  <header class="app-header">
    <div class="left-controls"><a href="home.html" style="color:var(--muted);text-decoration:none;font-size:20px">←</a></div>
    <div class="header-title">WALLET</div>
    <div class="right-controls">
      <div class="balance-pill"><span class="balance-value" id="hbal">100.00</span><span class="currency">$</span></div>
    </div>
  </header>
  <main class="content">
    <div class="wallet-wrap">
      <div class="w-card">
        <div class="w-tabs">
          <button class="tab active" onclick="showTab('dep')">📥 ПОПОЛНЕНИЕ</button>
          <button class="tab" onclick="showTab('wd')">📤 ВЫВОД</button>
        </div>

        <!-- DEPOSIT -->
        <div class="w-panel active" id="tab-dep">
          <div class="w-bal">
            <div class="w-bal-label">Баланс</div>
            <div class="w-bal-val">$<span id="dbal">100.00</span></div>
          </div>

          <div class="w-label">Способ оплаты</div>
          <div class="w-methods">
            <div class="w-method sel" id="m-cb" onclick="setPay('cb')">
              <span class="ico">🤖</span><span class="nm">CryptoBot</span>
            </div>
            <div class="w-method" id="m-xr" onclick="setPay('xr')">
              <span class="ico">🚀</span><span class="nm">xRocket</span>
            </div>
          </div>

          <div class="w-label">Сумма (USDT)</div>
          <input class="w-input" id="damt" type="number" min="0.1" step="0.1" value="10">
          <div class="w-quick">
            <button class="w-q" onclick="sd(1)">$1</button>
            <button class="w-q" onclick="sd(5)">$5</button>
            <button class="w-q" onclick="sd(10)">$10</button>
            <button class="w-q" onclick="sd(25)">$25</button>
            <button class="w-q" onclick="sd(50)">$50</button>
            <button class="w-q" onclick="sd(100)">$100</button>
          </div>

          <button class="w-btn w-dep-btn" id="dbtn" onclick="doDeposit()">💳 Пополнить</button>
          <div class="w-msg" id="dmsg"></div>
        </div>

        <!-- WITHDRAW -->
        <div class="w-panel" id="tab-wd">
          <div class="w-bal">
            <div class="w-bal-label">Доступно</div>
            <div class="w-bal-val">$<span id="wbal">100.00</span></div>
          </div>

          <div class="w-label">Способ вывода</div>
          <div class="w-methods">
            <div class="w-method sel" id="mw-cb" onclick="setPay('cb')">
              <span class="ico">🤖</span><span class="nm">CryptoBot</span>
            </div>
            <div class="w-method" id="mw-xr" onclick="setPay('xr')">
              <span class="ico">🚀</span><span class="nm">xRocket</span>
            </div>
          </div>

          <div class="w-label">Кошелёк USDT (TRC-20)</div>
          <input class="w-input" id="wwallet" type="text" placeholder="T... (адрес кошелька)">

          <div class="w-label">Сумма вывода</div>
          <input class="w-input" id="wamt" type="number" min="1" step="0.1" value="" placeholder="Мин. $1">
          <div class="w-receive">Получите: $<span id="wrec">0.00</span> <span style="font-size:11px;color:var(--muted)">(комиссия 3%)</span></div>

          <button class="w-btn w-wd-btn" id="wbtn" onclick="doWithdraw()" disabled>📤 Вывести</button>
          <div class="w-wd-info">Мин. вывод $1.05 / Комиссия 3% / Вывод вручную через поддержку</div>
          <div class="w-msg" id="wmsg"></div>
        </div>
      </div>
    </div>
  </main>
  <nav class="bottom-nav">
    <a href="home.html#games" class="nav-item" data-name="games"><span class="icon">🎮</span><span class="label">Games</span></a>
    <a href="wallet.html" class="nav-item active" data-name="wallet"><span class="icon">💼</span><span class="label">Wallet</span></a>
    <a href="home.html" class="nav-item center" data-name=""><span class="icon">💎</span></a>
    <a href="bonus.html" class="nav-item" data-name="bonus"><span class="icon">🎁</span><span class="label">Bonus</span></a>
    <a href="menu.html" class="nav-item" data-name="menu"><span class="icon">☰</span><span class="label">Menu</span></a>
  </nav>
  <script src="js/app.js"></script>
  <script>
  (function(){
    var uid='u'+Math.random().toString(36).substr(2,9);
    try{var tg=window.Telegram&&window.Telegram.WebApp;if(tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user)uid=String(tg.initDataUnsafe.user.id);}catch(e){}
    try{var s=localStorage.getItem('tg_uid');if(s)uid=s;}catch(e){}

    var bal=parseFloat(localStorage.getItem('mc_balance'))||100;
    var pay='cb';
    var invChk=null;

    function fmt(n){return Number(n).toFixed(2);}
    function upd(v){bal=v;localStorage.setItem('mc_balance',fmt(v));document.getElementById('dbal').textContent=fmt(v);document.getElementById('wbal').textContent=fmt(v);document.getElementById('hbal').textContent=fmt(v);document.querySelectorAll('.balance-value').forEach(function(el){el.textContent=fmt(v);});}
    function msg(el,t,y){el.textContent=t;el.className='w-msg show '+(y||'info');}
    function clr(el){el.className='w-msg';}

    window.showTab=function(t){document.querySelectorAll('.w-tabs .tab').forEach(function(x,i){x.classList.toggle('active',(t==='dep'&&i===0)||(t==='wd'&&i===1));});document.getElementById('tab-dep').classList.toggle('active',t==='dep');document.getElementById('tab-wd').classList.toggle('active',t==='wd');};
    window.setPay=function(p){pay=p;document.getElementById('m-cb').classList.toggle('sel',p==='cb');document.getElementById('m-xr').classList.toggle('sel',p==='xr');document.getElementById('mw-cb').classList.toggle('sel',p==='cb');document.getElementById('mw-xr').classList.toggle('sel',p==='xr');};
    window.sd=function(v){document.getElementById('damt').value=v;};

    document.getElementById('wamt').oninput=function(){var v=parseFloat(this.value)||0;var r=Math.max(0,v*0.97);document.getElementById('wrec').textContent=fmt(r);document.getElementById('wbtn').disabled=v<1.05;};

    window.doDeposit=function(){
      var amt=parseFloat(document.getElementById('damt').value)||0;
      if(amt<0.1){msg(document.getElementById('dmsg'),'Мин. сумма $0.1','err');return;}
      var btn=document.getElementById('dbtn');btn.disabled=true;btn.textContent='⏳ Создание...';
      clr(document.getElementById('dmsg'));
      var ep=pay==='xr'?'/api/deposit/xrocket':'/api/deposit/invoice';
      fetch(ep,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userId:uid,amount:amt})})
      .then(function(r){return r.json();})
      .then(function(d){
        console.log('deposit resp:',d);
        if(d.ok&&d.payUrl){
          msg(document.getElementById('dmsg'),'✅ Счёт создан! Переход на оплату...','ok');
          // redirect to payment
          if(window.Telegram&&window.Telegram.WebApp&&window.Telegram.WebApp.openLink){
            window.Telegram.WebApp.openLink(d.payUrl,{try_instant_view:false});
          }else{
            window.location.href=d.payUrl;
          }
          // check payment
          if(invChk)clearInterval(invChk);
         .invChk=setInterval(function(){
            fetch('/api/deposit/check',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({invoiceId:d.invoiceId})})
            .then(function(r){return r.json();})
            .then(function(cd){
              if(cd.status==='paid'){clearInterval(invChk);upd(bal+amt);msg(document.getElementById('dmsg'),'✅ Оплачено! +$'+fmt(amt),'ok');}
            }).catch(function(){});
          },3000);
        }else{
          msg(document.getElementById('dmsg'),'Ошибка: '+(d.error||'unknown'),'err');
        }
      }).catch(function(e){msg(document.getElementById('dmsg'),'Ошибка сети','err');})
      .finally(function(){btn.disabled=false;btn.textContent='💳 Пополнить';});
    };

    window.doWithdraw=function(){
      var amt=parseFloat(document.getElementById('wamt').value)||0;
      var wallet=document.getElementById('wwallet').value.trim();
      if(amt<1.05){msg(document.getElementById('wmsg'),'Мин. вывод $1.05','err');return;}
      if(!wallet){msg(document.getElementById('wmsg'),'Введите кошелёк','err');return;}
      if(amt>bal){msg(document.getElementById('wmsg'),'Недостаточно средств','err');return;}
      var btn=document.getElementById('wbtn');btn.disabled=true;btn.textContent='⏳ Заявка...';
      clr(document.getElementById('wmsg'));

      // Save withdrawal request to localStorage (admin will process)
      var requests=JSON.parse(localStorage.getItem('wd_requests')||'[]');
      requests.push({userId:uid,amount:amt,wallet:wallet,fee:Math.round(amt*0.03*100)/100,net:Math.round(amt*0.97*100)/100,date:Date.now(),status:'pending'});
      localStorage.setItem('wd_requests',JSON.stringify(requests));

      // Also try API
      var ep=pay==='xr'?'/api/withdraw/xrocket':'/api/withdraw';
      fetch(ep,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userId:uid,amount:amt,wallet:wallet})})
      .then(function(r){return r.json();})
      .then(function(d){
        console.log('withdraw resp:',d);
        if(d.ok){
          upd(d.balance);
          msg(document.getElementById('wmsg'),'✅ Вывод обработан! Получите: $'+fmt(d.net),'ok');
          document.getElementById('wamt').value='';document.getElementById('wamt').dispatchEvent(new Event('input'));
        }else{
          msg(document.getElementById('wmsg'),'Заявка создана! Ожидайте обработки в поддержке.','info');
        }
      }).catch(function(e){
        msg(document.getElementById('wmsg'),'Заявка сохранена! Обработаем в течение 24ч.','info');
      })
      .finally(function(){btn.disabled=false;btn.textContent='📤 Вывести';});
    };

    // Init
    upd(bal);
    document.getElementById('wamt').dispatchEvent(new Event('input'));
  })();
  </script>
</body>
</html>
