<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin — Promo Manager</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="app-header">
    <div class="left-controls">
      <a href="home.html" class="btn-icon">←</a>
    </div>
    <div class="header-title">Admin</div>
    <div class="right-controls"></div>
  </header>
  <main class="content">
    <section id="adminAuth" style="display:none;text-align:center;padding:40px">
      <h2>Вход в админ-панель</h2>
      <input id="adminKeyInput" type="password" placeholder="Введите админ-ключ" class="promo-input" style="max-width:300px">
      <button id="adminAuthBtn" class="btn" style="margin-top:12px">Войти</button>
    </section>
    
    <section id="adminPanel" style="display:none">
      <h3>Управление промокодами</h3>
      <div class="wallet-modal" style="position:static;box-shadow:none;padding:12px;max-width:720px">
        <div style="display:flex;gap:8px;align-items:center;margin-bottom:12px">
          <input id="adminCode" placeholder="Код (например: katyshka)" class="promo-input">
          <input id="adminAmount" placeholder="Сумма (например: 5.00)" class="promo-input" style="width:120px">
          <input id="adminMax" placeholder="Лимит активаций (0 = неогр.)" class="promo-input" style="width:160px">
          <button id="adminAdd" class="btn">Добавить</button>
        </div>
        <div class="admin-header">
          <div class="admin-col admin-name">Код</div>
          <div class="admin-col admin-uses">Активаций</div>
          <div class="admin-col admin-amount">Сумма</div>
          <div class="admin-col admin-actions"></div>
        </div>
        <div id="promoList"></div>
      </div>
    </section>
    <section id="adminPanel" style="margin-top:24px;display:none">
      <h3>Пользователи (выдача баланса)</h3>
      <div style="max-width:900px;padding:12px;box-shadow:none">
        <div class="admin-header">
          <div class="admin-col admin-name">ID / Имя</div>
          <div class="admin-col admin-uses">Логин</div>
          <div class="admin-col admin-amount">Баланс</div>
          <div class="admin-col admin-actions">Действия</div>
        </div>
        <div id="userList"></div>
      </div>
    </section>
  </main>
  <script src="js/app.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
