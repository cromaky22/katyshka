<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Crash — Nvuti</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/crash.css">

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<body class="page-crash">
  <!-- Cosmic background -->
  <div class="cosmic-bg">
    <div class="nebula n1"></div>
    <div class="nebula n2"></div>
    <div class="nebula n3"></div>
    <div class="nebula n4"></div>
    <div class="nebula n5"></div>
    <div class="stars-layer">
      <div class="star s1"></div><div class="star s2"></div><div class="star s3"></div>
      <div class="star s4"></div><div class="star s5"></div><div class="star s6"></div>
      <div class="star s7"></div><div class="star s8"></div><div class="star s9"></div>
      <div class="star s10"></div><div class="star s11"></div><div class="star s12"></div>
      <div class="star s13"></div><div class="star s14"></div><div class="star s15"></div>
    </div>
  </div>
  
  <header class="app-header">
    <div class="left-controls"></div>
    <div class="header-title">CRASH</div>
    <div class="right-controls" style="position:relative">
      <div class="balance-pill" id="balTrigger" style="cursor:pointer">
        <span class="wallet-icon">👛</span>
        <span class="balance-value" id="hbal">0.00</span>
        <span class="currency">$</span>
        <span class="caret">▾</span>
      </div>
      <button class="profile" id="profileBtn" title="Профиль" aria-label="Профиль"><img class="profile-icon" src="" alt="Аватар" onerror="this.style.display='none'"></button>
      <div class="profile-dropdown" id="profileDropdown">
        <div class="pd-header">
          <div class="pd-id-label">ID игрока</div>
          <div class="pd-id-value">
            <span id="pdUserId">—</span>
          </div>
        </div>
        <div class="pd-body">
          <a href="profile.html" class="pd-btn"><span class="pd-btn-icon">👤</span>Профиль<span class="pd-btn-arrow">→</span></a>
          <button class="pd-btn" id="pdPromoBtn"><span class="pd-btn-icon">🎟</span>Промокод<span class="pd-btn-arrow">→</span></button>
        </div>
      </div>
      <div class="pd-overlay" id="pdOverlay"></div>
    </div>
  </header>

  <main class="content">
    <section class="crash">
      <div class="crash-board">
        
        <!-- Топ хедер: множитель скролл + кнопка авто -->
        <div class="crash-top-bar">
          <div class="recent-crashes" id="recentCrashes">
            <span class="recent-label">ПОСЛЕДНИЕ:</span>
          </div>
          <button class="auto-cashout-toggle" id="autoCashoutToggle" title="Автовывод">
            <span class="auto-icon">⚡</span>
            <span class="auto-text">АВТО</span>
          </button>
        </div>

        <!-- Панель ставки -->
        <div class="stake-panel" id="stakePanel">
          <!-- Speed selector -->
          <div class="speed-selector">
            <button class="speed-btn active" data-speed="1">🐢 NORMAL</button>
            <button class="speed-btn" data-speed="1.6">🚀 FAST</button>
            <button class="speed-btn" data-speed="2.2">⚡ TURBO</button>
          </div>

          <div class="quick-bet-buttons-row">
            <div class="quick-bet-buttons">
              <button class="quick-bet-btn" data-amount="0.1">0.1$</button>
              <button class="quick-bet-btn" data-amount="1">1$</button>
              <button class="quick-bet-btn" data-amount="5">5$</button>
              <button class="quick-bet-btn" data-amount="10">10$</button>
              <button class="quick-bet-btn" data-amount="50">50$</button>
            </div>
            <div class="stake-helpers">
              <button class="stake-helper" id="halfBtn">½</button>
              <button class="stake-helper" id="doubleBtn">×2</button>
            </div>
          </div>

          <div class="stake-input-wrapper">
            <input id="stakeInput" type="number" min="0.1" step="0.1" value="0.1" placeholder="Сумма ставки">
            <span class="stake-currency">$</span>
          </div>

          <!-- Auto cashout inline -->
          <div class="auto-cashout-row" id="autoCashoutRow" style="display:none">
            <span class="auto-cashout-label">Вывод на:</span>
            <input id="autoCashoutInput" type="number" min="1.1" step="0.1" value="2" placeholder="2.00x">
            <span class="auto-cashout-x">×</span>
          </div>

          <button id="playBtn" class="btn play-btn">🚀 ПОЛЕТЕЛИ</button>
        </div>

        <!-- Панель игры -->
        <div class="game-panel" id="gamePanel" style="display:none">
          <div class="chart-container">
            <canvas id="crashChart"></canvas>
            <div class="crash-multiplier" id="crashMultiplier">1.00×</div>
            <div class="live-profit" id="liveProfit"></div>
          </div>

          <div class="game-stats-row">
            <div class="game-stat">
              <span class="stat-label">СТАВКА</span>
              <span class="stat-value" id="gameStake">$0.00</span>
            </div>
            <div class="game-stat">
              <span class="stat-label">ВЫИГРЫШ</span>
              <span class="stat-value" id="gameWinning">$0.00</span>
            </div>
            <div class="game-stat">
              <span class="stat-label">СКОРОСТЬ</span>
              <span class="stat-value" id="gameSpeed">1×</span>
            </div>
          </div>

          <button id="cashoutBtn" class="btn play-btn cashout-btn">
            <span class="cashout-icon">💰</span> ЗАБРАТЬ <span class="cashout-amount" id="cashoutAmount">$0.00</span>
          </button>
        </div>

        <!-- Панель результата -->
        <div class="result-panel" id="resultPanel" style="display:none">
          <div class="result-emoji" id="resultEmoji">💥</div>
          <div class="result-title">ИГРА ЗАВЕРШЕНА</div>
          <div class="result-multiplier" id="resultMultiplier">1.00×</div>
          <div id="gameStatus" class="game-status"></div>
          <button id="continueBtn" class="btn play-btn">НОВАЯ ИГРА</button>
        </div>

        <!-- История -->
        <div class="history-panel">
          <div class="history-header">
            <span>📊 ИСТОРИЯ</span>
            <span class="history-count" id="historyCount">0</span>
          </div>
          <div class="history-scroll" id="historyScroll"></div>
        </div>

      </div>
</section>
  </main>

  <nav class="bottom-nav">
    <a href="games.html" class="nav-item" data-name="games"><span class="icon">🎮</span><span class="label">Games</span></a>
    <a href="wallet.html" class="nav-item" data-name="wallet"><span class="icon">💼</span><span class="label">Wallet</span></a>
    <a href="home.html" class="nav-item center" data-name=""><span class="icon">💎</span></a>
    <a href="bonus.html" class="nav-item" data-name="bonus"><span class="icon">🎁</span><span class="label">Bonus</span></a>
    <a href="menu.html" class="nav-item" data-name="menu"><span class="icon">☰</span><span class="label">Menu</span></a>
  </nav>

  <script src="js/app.js"></script><script src="js/telegram-user.js"></script><script src="js/promo-modal.js"></script>
  <script src="js/balance.js"></script>
  <script src="js/wallet-modal.js"></script>
  <script src="js/profile-dropdown.js"></script>
  <script src="js/crash.js"></script>
  <script>
    function joinGame(){
      var socket = (window.Balance && Balance.getSocket) ? Balance.getSocket() : null;
      if(socket && socket.connected){
        socket.emit('join_game', 'crash');
        window.addEventListener('beforeunload', function(){ socket.emit('leave_game', 'crash'); });
      } else {
        setTimeout(joinGame, 500);
      }
    }
    setTimeout(joinGame, 1000);
  </script>
<script src="js/footer.js"></script>
</body>
</html>
