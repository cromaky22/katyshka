<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>GoldWest — Nvuti</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/goldwest.css">

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<body class="page-goldwest">

  <!-- Cosmic background -->
  <div class="cosmic-bg">
    <div class="nebula n1"></div>
    <div class="nebula n2"></div>
    <div class="nebula n3"></div>
    <div class="stars-layer">
      <div class="star s1"></div><div class="star s2"></div><div class="star s3"></div>
      <div class="star s4"></div><div class="star s5"></div><div class="star s6"></div>
      <div class="star s7"></div><div class="star s8"></div><div class="star s9"></div>
      <div class="star s10"></div><div class="star s11"></div><div class="star s12"></div>
    </div>
    <div class="comet c1"></div><div class="comet c2"></div>
  </div>

  <header class="app-header">
    <div class="left-controls"></div>
    <div class="header-title">GOLDWEST</div>
    <div class="right-controls" style="position:relative">
      <div class="balance-pill" id="balTrigger" style="cursor:pointer">
        <span class="wallet-icon">👛</span>
        <span class="balance-value" id="hbal">0.00</span>
        <span class="currency">$</span>
        <span class="caret">▾</span>
      </div>
      <button class="profile" id="profileBtn" title="Профиль" aria-label="Профиль"><img class="profile-icon" src="" alt="Аватар" onerror="this.style.display='none'"></button>
      <div class="profile-dropdown" id="profileDropdown">
        <div class="pd-header">
          <div class="pd-id-label">ID игрока</div>
          <div class="pd-id-value">
            <span id="pdUserId">—</span>
          </div>
        </div>
        <div class="pd-body">
          <a href="profile.html" class="pd-btn"><span class="pd-btn-icon">👤</span>Профиль<span class="pd-btn-arrow">→</span></a>
          <button class="pd-btn" id="pdPromoBtn"><span class="pd-btn-icon">🎟</span>Промокод<span class="pd-btn-arrow">→</span></button>
        </div>
      </div>
      <div class="pd-overlay" id="pdOverlay"></div>
    </div>
  </header>

  <main class="content">
    <section class="goldwest-game">
      <div class="gw-board">

        <!-- Выбор бомб -->
        <div class="gw-bomb-select" id="bombSelect">
          <div class="gw-bomb-option active" data-bombs="1">
            <div class="gw-bomb-label">1 бомба</div>
            <div class="gw-bomb-coef">x2</div>
          </div>
          <div class="gw-bomb-option" data-bombs="2">
            <div class="gw-bomb-label">2 бомбы</div>
            <div class="gw-bomb-coef">x3</div>
          </div>
        </div>

        <!-- Уровни -->
        <div class="gw-levels" id="levelsArea"></div>

        <!-- Результат -->
        <div class="gw-result" id="resultArea" style="display:none">
          <div class="gw-result-text" id="resultText"></div>
          <div class="gw-result-coef" id="resultCoef"></div>
        </div>

        <!-- Кнопка забрать -->
        <button class="gw-btn gw-collect-btn" id="collectBtn" style="display:none">💰 Забрать выигрыш</button>

        <!-- Ставка -->
        <div class="gw-stake-panel" id="stakePanel">
          <div class="gw-stake-header">
            <label>Ставка</label>
            <span class="gw-stake-range">От $0.10 до $200</span>
          </div>
          <div class="gw-quick-bets">
            <button class="gw-quick-btn" data-amount="0.1"><span class="dollar">$</span>+0.1</button>
            <button class="gw-quick-btn" data-amount="1"><span class="dollar">$</span>+1</button>
            <button class="gw-quick-btn" data-amount="5"><span class="dollar">$</span>+5</button>
            <button class="gw-quick-btn" data-amount="10"><span class="dollar">$</span>+10</button>
          </div>
          <div class="gw-stake-row">
            <input id="stakeInput" type="number" min="0.1" max="200" step="0.1" value="0.1">
            <div class="gw-stake-btns">
              <button id="halfBtn" class="gw-stake-btn">½</button>
              <button id="doubleBtn" class="gw-stake-btn">×2</button>
            </div>
          </div>
          <button class="gw-btn gw-play-btn" id="playBtn">🎰 ИГРАТЬ</button>
        </div>

        <div id="gameStatus" class="gw-status" aria-live="polite"></div>

      </div>
    </section>
  </main>

  <nav class="bottom-nav">
    <a href="games.html" class="nav-item" data-name="games"><span class="icon">🎮</span><span class="label">Games</span></a>
    <a href="wallet.html" class="nav-item" data-name="wallet"><span class="icon">💼</span><span class="label">Wallet</span></a>
    <a href="home.html" class="nav-item center" data-name=""><span class="icon">💎</span></a>
    <a href="bonus.html" class="nav-item" data-name="bonus"><span class="icon">🎁</span><span class="label">Bonus</span></a>
    <a href="menu.html" class="nav-item" data-name="menu"><span class="icon">☰</span><span class="label">Menu</span></a>
  </nav>

  <script src="js/app.js"></script><script src="js/promo-modal.js"></script>
  <script src="js/balance.js"></script>
  <script src="js/wallet-modal.js"></script>
  <script src="js/profile-dropdown.js"></script>
  <script src="js/goldwest.js"></script>
  <script>
    function joinGame(){
      var socket = (window.Balance && Balance.getSocket) ? Balance.getSocket() : null;
      if(socket && socket.connected){
        socket.emit('join_game', 'goldwest');
        window.addEventListener('beforeunload', function(){ socket.emit('leave_game', 'goldwest'); });
      } else {
        setTimeout(joinGame, 500);
      }
    }
    setTimeout(joinGame, 1000);
  </script>
</body>
</html>
