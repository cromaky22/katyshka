<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Профиль — Katyshka</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/profile.css">
</head>
<body>
  <header class="app-header">
    <div class="left-controls">
      <a href="home.html" class="btn-icon" aria-label="back">←</a>
    </div>
    <div class="header-title">ПРОФИЛЬ</div>
    <div class="right-controls">
      <div class="balance-pill">
        <span class="wallet-icon">💠</span>
        <span class="balance-value">0.00</span>
        <span class="currency">$</span>
        <span class="caret">▾</span>
      </div>
      <button class="profile" id="profileBtn" title="Профиль" aria-label="Профиль">
        <img class="profile-icon" id="profileImg" src="" alt="Аватар" onerror="this.style.display='none'">
      </button>
      <div class="profile-dropdown" id="profileDropdown">
        <div class="pd-header">
          <div class="pd-id-label">ID игрока</div>
          <div class="pd-id-value">
            <span id="pdUserId">—</span>
            <span class="copy-id" id="copyIdBtn" title="Копировать ID">📋</span>
          </div>
        </div>
        <div class="pd-body">
          <a href="profile.html" class="pd-btn"><span class="pd-btn-icon">👤</span>Профиль<span class="pd-btn-arrow">→</span></a>
          <button class="pd-btn" id="pdPromoBtn"><span class="pd-btn-icon">🎟</span>Промокод<span class="pd-btn-arrow">→</span></button>
        </div>
      </div>
      <div class="pd-overlay" id="pdOverlay"></div>
    </div>
  </header>

  <main class="content">
    <section class="profile-section">
      <div class="profile-card">
        <div class="profile-avatar-wrap">
          <div class="profile-avatar" id="profileAvatarBig">
            <img src="" alt="Аватар" id="profileAvatarImg" onerror="this.style.display='none'">
          </div>
        </div>
        <div class="profile-name" id="profileName">Игрок</div>
        <div class="profile-id-display">ID: <span id="profileIdDisplay">—</span></div>
      </div>

      <div class="profile-stats">
        <div class="stat-card">
          <div class="stat-icon">💠</div>
          <div class="stat-info">
            <div class="stat-label">Баланс</div>
            <div class="stat-value" id="profileBalance">$0.00</div>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">🎮</div>
          <div class="stat-info">
            <div class="stat-label">Игр сыграно</div>
            <div class="stat-value" id="profileGames">0</div>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">🏆</div>
          <div class="stat-info">
            <div class="stat-label">Выигрыш</div>
            <div class="stat-value" id="profileWins">$0.00</div>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">🎁</div>
          <div class="stat-info">
            <div class="stat-label">Промокодов</div>
            <div class="stat-value" id="profilePromos">0</div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- Promo modal -->
  <div class="promo-modal" id="promoModal" aria-hidden="true" style="display:none">
    <div class="promo-card">
      <button class="promo-close" id="promoClose" aria-label="Close">✕</button>
      <div class="promo-illustration"><img src="assets/promo_card.png" alt="promo" onerror="this.style.display='none'"></div>
      <h3>Активируй промокод и получи бонус</h3>
      <p class="promo-sub">Введите код</p>
      <input id="promoCodeInput" class="promo-input" placeholder="katyshka" maxlength="40">
      <div class="promo-actions">
        <button id="promoActivate" class="btn">Активировать</button>
      </div>
      <div id="promoMessage" class="promo-message" aria-live="polite"></div>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="home.html#games" class="nav-item" data-name="games"><span class="icon">🎮</span><span class="label">Games</span></a>
    <a href="wallet.html" class="nav-item" data-name="wallet"><span class="icon">💼</span><span class="label">Wallet</span></a>
    <a href="home.html" class="nav-item center" data-name=""><span class="icon">💎</span></a>
    <a href="bonus.html" class="nav-item" data-name="bonus"><span class="icon">🎁</span><span class="label">Bonus</span></a>
    <a href="menu.html" class="nav-item" data-name="menu"><span class="icon">☰</span><span class="label">Menu</span></a>
  </nav>
  <script src="js/app.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
