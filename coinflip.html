<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Coinflip — Nvuti</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/coinflip.css">
</head>
<body class="page-coinflip">
  <header class="app-header">
    <div class="left-controls">
      <!-- left controls intentionally empty for Coinflip mode -->
    </div>
    <div class="header-title">Coinflip</div>
    <div class="right-controls">
      <a class="profile" href="#"></a>
    </div>
  </header>

  <main class="content">
    <section class="coinflip">
      <div class="coinflip-board">
        <div class="score-bar">
          <div class="score-left">
            <div class="score-main">0 из 20</div>
            <div class="score-sub">раунд</div>
          </div>
          <div class="score-right">
            <div class="score-main">x0</div>
            <div class="score-sub">множитель</div>
          </div>
        </div>
        <div class="coin-wrap">
          <div class="coin" id="coin">
            <div class="side side-head">ОРЕЛ</div>
            <div class="side side-tail">РЕШКА</div>
          </div>
        </div>

        <div class="multipliers-row" aria-hidden="true">
          <button class="mult-nav mult-prev" aria-label="previous">◀</button>
          <div class="multipliers" id="multipliers">
            <div class="mult-item"><span class="mult-icon">🟡</span><span class="mult-value">x1.94</span></div>
            <div class="mult-item"><span class="mult-icon">🟡</span><span class="mult-value">x3.88</span></div>
            <div class="mult-item"><span class="mult-icon">🟡</span><span class="mult-value">x7.76</span></div>
            <div class="mult-item"><span class="mult-icon">🟡</span><span class="mult-value">x15.52</span></div>
            <div class="mult-item"><span class="mult-icon">🟡</span><span class="mult-value">x31.04</span></div>
            <div class="mult-item"><span class="mult-icon">🟡</span><span class="mult-value">x62.08</span></div>
            <div class="mult-item"><span class="mult-icon">🟡</span><span class="mult-value">x124.16</span></div>
            <div class="mult-item"><span class="mult-icon">🟡</span><span class="mult-value">x248.32</span></div>
            <div class="mult-item"><span class="mult-icon">🟡</span><span class="mult-value">x496.64</span></div>
            <div class="mult-item"><span class="mult-icon">🟡</span><span class="mult-value">x993.28</span></div>
          </div>
          <button class="mult-nav mult-next" aria-label="next">▶</button>
        </div>

        <div class="controls">
          <div class="buttons">
            <button id="btnHead" class="btn btn-primary">
              <span class="coin-badge coin-head" aria-hidden="true">🟡</span>
              <span class="btn-label">ОРЕЛ</span>
            </button>
            <button id="btnTail" class="btn btn-primary">
              <span class="btn-label">РЕШКА</span>
              <span class="coin-badge coin-tail" aria-hidden="true">⚪</span>
            </button>
          </div>
          <div class="stake-row">
            <label>Ставка</label>
            <input id="stake" type="number" min="1" value="10">
            <button id="play" class="btn">ИГРАТЬ</button>
          </div>
        </div>

        <div id="result" class="coinflip-result" aria-live="polite"></div>
      </div>
    </section>
  </main>

  <nav class="bottom-nav">
    <a href="home.html#games" class="nav-item" data-name="games"><span class="icon">🎮</span><span class="label">Games</span></a>
    <a href="wallet.html" class="nav-item" data-name="wallet"><span class="icon">💼</span><span class="label">Wallet</span></a>
    <a href="home.html" class="nav-item center" data-name=""><span class="icon">💎</span></a>
    <a href="bonus.html" class="nav-item" data-name="bonus"><span class="icon">🎁</span><span class="label">Bonus</span></a>
    <a href="menu.html" class="nav-item" data-name="menu"><span class="icon">☰</span><span class="label">Menu</span></a>
  </nav>
  <script src="js/coinflip.js"></script>
</body>
</html>
