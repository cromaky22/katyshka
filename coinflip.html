<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Coinflip — Nvuti</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/coinflip.css">

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<body class="page-coinflip">
  <header class="app-header">
    <div class="left-controls">
      <!-- left controls intentionally empty for Coinflip mode -->
    </div>
    <div class="header-title">Coinflip</div>
    <div class="right-controls" style="position:relative">
      <div class="balance-pill" id="balTrigger" style="cursor:pointer">
        <span class="wallet-icon">👛</span>
        <span class="balance-value" id="hbal">0.00</span>
        <span class="currency">$</span>
        <span class="caret">▾</span>
      </div>
      <button class="profile" id="profileBtn" title="Профиль" aria-label="Профиль"><img class="profile-icon" src="" alt="Аватар" onerror="this.style.display='none'"></button>
      <div class="profile-dropdown" id="profileDropdown">
        <div class="pd-header">
          <div class="pd-id-label">ID игрока</div>
          <div class="pd-id-value">
            <span id="pdUserId">—</span>
          </div>
        </div>
        <div class="pd-body">
          <a href="profile.html" class="pd-btn"><span class="pd-btn-icon">👤</span>Профиль<span class="pd-btn-arrow">→</span></a>
          <button class="pd-btn" id="pdPromoBtn"><span class="pd-btn-icon">🎟</span>Промокод<span class="pd-btn-arrow">→</span></button>
        </div>
      </div>
      <div class="pd-overlay" id="pdOverlay"></div>
    </div>
  </header>

  <main class="content">
    <section class="coinflip">
      <div class="coinflip-board">
        <div class="score-bar">
          <div class="score-left">
            <div id="scoreRounds" class="score-main">0 из 20</div>
            <div class="score-sub">раунд</div>
          </div>
          <div class="score-right">
            <div id="scoreMultiplier" class="score-main">x0</div>
            <div class="score-sub">множитель</div>
          </div>
        </div>
        <div class="coin-wrap">
          <div class="coin show-head" id="coin">
            <div class="side side-head">
              <img src="assets/orel.jpg.png" alt="ОРЕЛ">
            </div>
            <div class="side side-tail">
              <img src="assets/reshka.jpg.png" alt="РЕШКА">
            </div>
          </div>
        </div>

        <div class="multipliers-row" aria-hidden="true">
          <button class="mult-nav mult-prev" aria-label="previous">◀</button>
          <div class="multipliers" id="multipliers">
            <div class="mult-item"><span class="mult-icon"><img src="assets/coin.png" alt="coin"></span><span class="mult-value">x1.94</span></div>
            <div class="mult-item"><span class="mult-icon"><img src="assets/coin.png" alt="coin"></span><span class="mult-value">x3.88</span></div>
            <div class="mult-item"><span class="mult-icon"><img src="assets/coin.png" alt="coin"></span><span class="mult-value">x7.76</span></div>
            <div class="mult-item"><span class="mult-icon"><img src="assets/coin.png" alt="coin"></span><span class="mult-value">x15.52</span></div>
            <div class="mult-item"><span class="mult-icon"><img src="assets/coin.png" alt="coin"></span><span class="mult-value">x31.04</span></div>
            <div class="mult-item"><span class="mult-icon"><img src="assets/coin.png" alt="coin"></span><span class="mult-value">x62.08</span></div>
            <div class="mult-item"><span class="mult-icon"><img src="assets/coin.png" alt="coin"></span><span class="mult-value">x124.16</span></div>
            <div class="mult-item"><span class="mult-icon"><img src="assets/coin.png" alt="coin"></span><span class="mult-value">x248.32</span></div>
            <div class="mult-item"><span class="mult-icon"><img src="assets/coin.png" alt="coin"></span><span class="mult-value">x496.64</span></div>
            <div class="mult-item"><span class="mult-icon"><img src="assets/coin.png" alt="coin"></span><span class="mult-value">x993.28</span></div>
          </div>
          <button class="mult-nav mult-next" aria-label="next">▶</button>
        </div>

        <div class="controls">
          <div class="buttons">
            <button id="btnHead" class="btn btn-primary">
              <span class="coin-badge coin-head" aria-hidden="true"><img src="assets/orel.jpg.png" alt="ОРЕЛ"></span>
              <span class="btn-label">ОРЕЛ</span>
              <span id="stakeHead" class="btn-stake" aria-hidden="true"></span>
            </button>
            <button id="btnTail" class="btn btn-primary">
              <span class="btn-label">РЕШКА</span>
              <span class="btn-stake" id="stakeTail" aria-hidden="true"></span>
              <span class="coin-badge coin-tail" aria-hidden="true"><img src="assets/reshka.jpg.png" alt="РЕШКА"></span>
            </button>
          </div>
          <div class="stake-row">
            <div class="stake-head">
              <label>Ставка</label>
              <span class="stake-range">От <span class="currency-sign-green">$</span>0.10 до <span class="currency-sign-green">$</span>200</span>
            </div>
            <input id="stake" type="number" min="0.1" max="200" step="0.1" value="0.10">
            <button id="play" class="btn">ИГРАТЬ</button>
            <div class="chain-controls" id="chainControls" aria-hidden="true" style="display:none">
              <span id="accumulatedDisplay" class="acc-value">$ 0.00</span>
              <button id="collectBtn" class="btn collect-btn">ЗАБРАТЬ</button>
            </div>
          </div>
        </div>

        <div id="result" class="coinflip-result" aria-live="polite"></div>
      </div>
    </section>
  </main>

  <nav class="bottom-nav">
    <a href="games.html" class="nav-item" data-name="games"><span class="icon">🎮</span><span class="label">Games</span></a>
    <a href="wallet.html" class="nav-item" data-name="wallet"><span class="icon">💼</span><span class="label">Wallet</span></a>
    <a href="home.html" class="nav-item center" data-name=""><span class="icon">💎</span></a>
    <a href="bonus.html" class="nav-item" data-name="bonus"><span class="icon">🎁</span><span class="label">Bonus</span></a>
    <a href="menu.html" class="nav-item" data-name="menu"><span class="icon">☰</span><span class="label">Menu</span></a>
  </nav>
  <script src="js/app.js"></script><script src="js/telegram-user.js"></script><script src="js/promo-modal.js"></script>
  <script src="js/balance.js"></script>
  <script src="js/wallet-modal.js"></script>
  <script src="js/profile-dropdown.js"></script>
  <script src="js/coinflip.js"></script>
  <script>
    function joinGame(){
      var socket = (window.Balance && Balance.getSocket) ? Balance.getSocket() : null;
      if(socket && socket.connected){
        socket.emit('join_game', 'coinflip');
        window.addEventListener('beforeunload', function(){ socket.emit('leave_game', 'coinflip'); });
      } else {
        setTimeout(joinGame, 500);
      }
    }
    setTimeout(joinGame, 1000);
  </script>
</body>
</html>
