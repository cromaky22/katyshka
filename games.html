<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mini Casino — Games</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="app-header">
    <div class="left-controls">
      <button class="btn-icon" aria-label="back">✕</button>
      <img src="assets/logo.png" alt="Logo" class="logo-small" onerror="this.style.display='none'">
    </div>
    <div class="header-title">KATYSHKA</div>
    <div class="right-controls">
      <div class="balance-pill">
        <span class="wallet-icon">💠</span>
        <span class="balance-value">0.00</span>
        <span class="currency">$</span>
        <span class="caret">▾</span>
      </div>
      <a href="menu.html" class="profile" title="Профиль"><img src="assets/avatar.png" alt="Profile" onerror="this.style.display='none'"></a>
    </div>
  </header>
  <main class="content">
    <script>
      // redirect to unified home+games page
      location.replace('home.html#games');
    </script>
    <noscript>
      <p>Пожалуйста, включите JavaScript. Перейдите на <a href="home.html#games">главную</a>.</p>
    </noscript>
  </main>
  <nav class="bottom-nav">
    <a href="games.html" class="nav-item" data-name="games"><span class="icon">🎮</span><span class="label">Games</span></a>
    <a href="wallet.html" class="nav-item" data-name="wallet"><span class="icon">💼</span><span class="label">Wallet</span></a>
    <a href="home.html" class="nav-item center" data-name=""><span class="icon">💎</span></a>
    <a href="bonus.html" class="nav-item" data-name="bonus"><span class="icon">🎁</span><span class="label">Bonus</span></a>
    <a href="menu.html" class="nav-item" data-name="menu"><span class="icon">☰</span><span class="label">Menu</span></a>
  </nav>
  <script src="js/app.js"></script>
</body>
</html>
